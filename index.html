async function renderAuditLog(){
  const wrap=document.getElementById("auditlog-content");
  if(!wrap) return;
  wrap.innerHTML='<div style="padding:2rem;text-align:center;color:var(--mid)">Loading…</div>';
  const periodFilter=document.getElementById("audit-period-filter")?document.getElementById("audit-period-filter").value:"";
  try{
    const url=periodFilter?`${API_BASE}?action=load_audit_period&period=${encodeURIComponent(periodFilter)}`:`${API_BASE}?action=load_timesheets`;
    const r=await fetch(url);
    const data=await r.json();
    let log=[];
    if(periodFilter){
      if(!data.success){wrap.innerHTML='<div style="padding:2rem;color:#ef4444">Failed to load audit log.</div>';return;}
      log=data.log||[];
    } else {
      // Synthesize a basic log from timesheet statuses when no period selected
      const records=data.records||[];
      records.forEach(ts=>{
        if(ts.submitted_at) log.push({created_at:ts.submitted_at,user_name:ts.employee,action:'submitted',employee_name:ts.employee,period:ts.period});
        if(ts.approved_at) log.push({created_at:ts.approved_at,user_name:ts.approved_by_name||'Staff',action:ts.status,employee_name:ts.employee,period:ts.period});
      });
      log.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    }
    if(!log.length){wrap.innerHTML='<div style="padding:2.5rem;text-align:center;color:var(--mid)">No audit events found for this period.</div>';return;}
    const actionColor={submitted:"#f59e0b",approved:"#10b981",rejected:"#ef4444",returned:"#6366f1",hr_override:"#8b5cf6",ghl_auto_add:"#06b6d4",flagged_discrepancy:"#f97316"};
    const rows=log.map(entry=>{
      const color=actionColor[entry.action]||"#94a3b8";
      const dt=entry.created_at?new Date(entry.created_at).toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
      let detail="";
      if(entry.after_state){try{const a=JSON.parse(entry.after_state);detail=a.reason||a.comment||a.total_hours||"";}catch(e){}}
      return `<tr>
        <td style="font-size:.76rem;color:var(--mid);white-space:nowrap">${dt}</td>
        <td><strong>${entry.employee_name||entry.user_name||"—"}</strong></td>
        <td style="font-size:.78rem;color:var(--mid)">${entry.period||"—"}</td>
        <td><span style="background:${color}22;color:${color};padding:.2rem .5rem;border-radius:5px;font-size:.73rem;font-weight:600;white-space:nowrap">${entry.action}</span></td>
        <td style="font-size:.76rem;color:var(--mid)">${entry.user_name||"—"}</td>
        <td style="font-size:.76rem;color:var(--mid)">${detail}</td>
      </tr>`;
    }).join("");
    wrap.innerHTML=`<div class="billing-tbl"><table>
      <thead><tr><th>Time</th><th>Employee</th><th>Period</th><th>Event</th><th>By</th><th>Detail</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }catch(e){
    wrap.innerHTML=`<div style="padding:2rem;color:#ef4444">Error: ${e.message}</div>`;
  }
}

async function saveClient(){

    else alert(r.error||"Failed.");

}

// State for the projects tab
let _pm = {
  view: 'board',        // 'board' | 'detail' | 'mytasks' | 'projects'
  projects: [],
  tasks: [],
  followedTaskIds: [],  // task ids this user follows
  activeProject: null,  // project object when in 'detail' view
  activeTask: null,     // task object when comment panel is open
  comments: [],
  clientFilter: '',     // client_name filter string
  loading: false
};

const STAGES=[
  {key:'backlog',   label:'Backlog'},
  {key:'todo',      label:'To Do'},
  {key:'inprogress',label:'In Progress'},
  {key:'inreview',  label:'In Review'},
  {key:'done',      label:'Done'}
];

function pmRoot(){return document.getElementById('projects-root');}

async function renderProjects(){
  const root=pmRoot();
  if(!root)return;
  root.innerHTML='<div style="padding:2rem;text-align:center;color:var(--mid)">Loading…</div>';
  _pm.loading=true;
  try{
    const dbId=cur.db_id||(cur.id?parseInt(cur.id.replace('e',''))||0:0);
    const fetches=[
      fetch(`api.php?action=load_projects`).then(r=>r.json()),
      fetch(`api.php?action=load_tasks`).then(r=>r.json())
    ];
    if(dbId) fetches.push(fetch(`api.php?action=load_followed_tasks&uid=${dbId}`).then(r=>r.json()).catch(()=>({tasks:[]})));
    const results=await Promise.all(fetches);
    _pm.projects = results[0].projects||[];
    _pm.tasks    = results[1].tasks||[];
    // Merge followed tasks (avoid duplicates)
    if(results[2]){
      const followedTasks=results[2].tasks||[];
      const existingIds=new Set(_pm.tasks.map(t=>t.id));
      followedTasks.forEach(t=>{ if(!existingIds.has(t.id)){t._followed=true;_pm.tasks.push(t);} });
      _pm.followedTaskIds=followedTasks.map(t=>t.id);
    }
    _pm.loading  = false;
    _pm.view='projects';
    _pm.activeProject=null;
    _pmProjectsView();
  }catch(e){
    root.innerHTML=`<div style="padding:2rem;text-align:center;color:#f87171">Failed to load projects: ${e.message}</div>`;
  }
}

function _renderPMBoard(){
  const root=pmRoot();

  const canManage=(role==='admin'||role==='manager'||role==='hr');
  const myDbId=String(cur.db_id||cur.id.replace('e',''));

  let visibleTasks = canManage ? _pm.tasks

  // Apply client filter
  if(_pm.clientFilter) visibleTasks=visibleTasks.filter(t=>t.client_name===_pm.clientFilter);

  // Build unique client list for filter dropdown
  const clientNames=[...new Set(_pm.tasks.map(t=>t.client_name).filter(Boolean))].sort();
  const clientFilterHtml=clientNames.length?`

      onchange="_pm.clientFilter=this.value;_renderPMBoard()">

      <button class="btn btn-outline" style="font-size:.8rem;padding:.4rem .9rem" onclick="_pmMyTasks()">My Tasks</button>

    </div>
  </div>
  <div class="pm-board">`;

  STAGES.forEach(s=>{
    const stageTasks=visibleTasks.filter(t=>t.stage===s.key);
    h+=`<div class="pm-col">
      <div class="pm-col-header stage-${s.key}">
        <span class="pm-col-label stage-${s.key}">${s.label}</span>
        <span class="pm-col-count">${stageTasks.length}</span>
      </div>
      <div class="pm-cards" id="pm-col-${s.key}"
        ondragover="event.preventDefault();event.currentTarget.style.background='var(--alt)'"
        ondragleave="event.currentTarget.style.background=''"
        ondrop="event.currentTarget.style.background='';_pmDragDrop(event,'${s.key}')">`;
    stageTasks.forEach(t=>{
      h+=_pmTaskCard(t,s);
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;

  // Add Project modal (hidden)
  h+=_pmProjectModalHTML();
  // Add Task modal (hidden)
  h+=_pmTaskModalHTML();
  // Move modal (hidden)
  h+=_pmMoveModalHTML();

  root.innerHTML=h;

function _pmTaskCard(t,s){

  const dueColor=t.due_date&&new Date(t.due_date)<new Date()?'color:#f87171':'color:var(--mid)';
  const dueTxt=t.due_date?t.due_date.slice(5):''; // MM-DD
  const btCls=t.billing_type?`btype-tag bt-${t.billing_type}`:'btype-tag bt-billable';

  return `<div class="pm-card stage-${s.key}" draggable="true"

      <span class="${btCls}">${btLabel}</span>
      <span style="flex:1"></span>
      ${dueTxt?`<span style="font-size:.7rem;${dueColor}">${dueTxt}</span>`:''}

    <div style="display:flex;gap:.35rem;margin-top:.35rem">
      <button class="pm-move-btn" style="flex:1" onclick="event.stopPropagation();_pmMoveModal(${t.id},'${s.key}')">→ Move</button>

async function _pmOpenTask(taskId){
  const task=_pm.tasks.find(t=>t.id===taskId);
  if(!task)return;
  _pm.activeTask=task;
  try{
    const [cRes, fRes]=await Promise.all([
      fetch(`api.php?action=load_task_comments&task_id=${taskId}`).then(r=>r.json()),
      fetch(`api.php?action=load_task_followers&task_id=${taskId}`).then(r=>r.json()).catch(()=>({followers:[]}))
    ]);
    _pm.comments=cRes.comments||[];
    _pm.taskFollowers=fRes.followers||[];
    _pmShowTaskPanel(task);
  }catch(e){
    _pm.comments=[];
    _pm.taskFollowers=[];
    _pmShowTaskPanel(task);
  }
}

async function _pmCompleteTask(taskId){
  try{
    const p=new URLSearchParams({action:'update_task',id:taskId,stage:'done',actor_id:cur.id,actor_name:cur.name});
    const r=await fetch(API_BASE+'?'+p).then(x=>x.json());
    if(!r.success)throw new Error(r.error||'Unknown error');
    const t=_pm.tasks.find(t=>t.id===taskId);
    if(t) t.stage='done';
    const panel=document.getElementById('pm-task-panel');
    if(panel) panel.remove();
    if(_pm.view==='detail'&&_pm.activeProject) _pmProjectDetail(_pm.activeProject.id);
    else if(_pm.view==='board'&&_pm.activeProject) _pmProjectBoard(_pm.activeProject.id);
    else if(_pm.view==='mytasks') _pmMyTasks();
    else _renderPMBoard();
  }catch(e){alert('Error completing task: '+e.message);}
}

async function _pmSaveTaskEdits(taskId){
  const assignEl=document.getElementById('pm-edit-assign');
  const priEl=document.getElementById('pm-edit-priority');
  const dueEl=document.getElementById('pm-edit-due');
  const assignId=assignEl?assignEl.value:'';
  const assignName=assignEl&&assignEl.value?EMPS.find(e=>String(e.id)===assignEl.value)?.name||'':'';
  const priority=priEl?priEl.value:'medium';
  const due=dueEl?dueEl.value:'';
  try{
    const p=new URLSearchParams({action:'update_task',id:taskId,assigned_to:assignId,assigned_name:assignName,priority,due_date:due,actor_id:cur.id,actor_name:cur.name});
    const r=await fetch(API_BASE+'?'+p).then(x=>x.json());
    if(!r.success)throw new Error(r.error||'Unknown error');
    // Update local state
    const t=_pm.tasks.find(t=>t.id===taskId);
    if(t){t.assigned_to=assignId;t.assigned_name=assignName;t.priority=priority;t.due_date=due;}
    // Close panel and re-render
    const panel=document.getElementById('pm-task-panel');
    if(panel)panel.remove();
    if(_pm.view==='detail'&&_pm.activeProject) _pmProjectDetail(_pm.activeProject.id);
    else if(_pm.view==='board'&&_pm.activeProject) _pmProjectBoard(_pm.activeProject.id);
    else if(_pm.view==='mytasks') _pmMyTasks();
    else _renderPMBoard();
  }catch(e){alert('Error saving: '+e.message);}
}

async function _pmToggleFollow(taskId){
  const dbId=parseInt(cur.db_id||cur.id.replace('e','')||0);
  if(!dbId)return;
  try{
    const p=new URLSearchParams({action:'toggle_task_follower',task_id:taskId,user_id:dbId});
    const r=await fetch(API_BASE+'?'+p).then(x=>x.json());
    if(!r.success)throw new Error(r.error||'Failed');
    const nowFollowing=r.following;
    // Update local followed list
    if(nowFollowing){
      if(!_pm.followedTaskIds.includes(taskId))_pm.followedTaskIds.push(taskId);
      if(!_pm.taskFollowers)_pm.taskFollowers=[];
      if(!_pm.taskFollowers.includes(dbId))_pm.taskFollowers.push(dbId);
      // Add task to local tasks if not already there
      const task=_pm.tasks.find(t=>t.id===taskId);
      if(task)task._followed=true;
    } else {
      _pm.followedTaskIds=_pm.followedTaskIds.filter(id=>id!==taskId);
      _pm.taskFollowers=(_pm.taskFollowers||[]).filter(id=>id!==dbId);
    }
    // Update button without full re-render
    const btn=document.getElementById('pm-follow-btn');
    if(btn){
      btn.className='btn '+(nowFollowing?'btn-primary':'btn-outline');
      btn.textContent=nowFollowing?'★ Following':'☆ Follow';
    }
  }catch(e){alert('Error: '+e.message);}
}

async function _pmSubmitComment(taskId){
  const inp=document.getElementById('pm-comment-input');
  const comment=inp?inp.value.trim():'';
  if(!comment)return;
  inp.value='';
  try{
    const cp=new URLSearchParams({action:'add_task_comment',task_id:taskId,user_id:cur.id,user_name:cur.name,comment});
    await fetch(API_BASE+'?'+cp).then(x=>x.json());
    // Refresh comments
    const cRes=await fetch(`api.php?action=load_task_comments&task_id=${taskId}`).then(r=>r.json());
    _pm.comments=cRes.comments||[];
    const list=document.getElementById('pm-comments-list');
    if(list){
      list.innerHTML=_pm.comments.map(c=>`
        <div class="${c.is_activity?'pm-activity':'pm-comment'}">
          <span class="pm-cmt-who">${escHtml(c.user_name)}</span>
          <span class="pm-cmt-time"> · ${c.created_at?.slice(5,16)||''}</span>
          <div class="pm-cmt-text">${escHtml(c.comment)}</div>
        </div>`).join('');
    }
  }catch(e){alert('Error: '+e.message);}
}

// ── MOVE MODAL ────────────────────────────────────────────────────────────
function _pmMoveModal(taskId,currentStage){
  const modal=document.getElementById('pm-move-modal');
  if(!modal)return;
  const task=_pm.tasks.find(t=>t.id===taskId);
  modal.querySelector('#pm-move-title').textContent=task?task.title:'Task';
  modal.querySelector('#pm-move-task-id').value=taskId;
  modal.querySelector('#pm-move-current').value=currentStage;

  // Highlight suggested next stage
  const curIdx=STAGES.findIndex(s=>s.key===currentStage);
  const suggested=STAGES[curIdx+1]?.key||null;

  modal.querySelectorAll('.pm-stage-btn').forEach(btn=>{
    const k=btn.dataset.stage;
    btn.className='pm-stage-btn'+(k===currentStage?' pm-stage-current':k===suggested?' pm-stage-suggested':'');
    btn.disabled=(k===currentStage);
  });
  modal.style.display='flex';
}

function _pmMoveModalHTML(){
  const buttons=STAGES.map(s=>`<button class="pm-stage-btn" data-stage="${s.key}" onclick="_pmDoMove('${s.key}')">${s.label}</button>`).join('');
  return `<div id="pm-move-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;align-items:center;justify-content:center">
    <div style="background:var(--bg);border-radius:14px;padding:1.5rem;max-width:380px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.35)">
      <h3 id="pm-move-title" style="margin:0 0 .3rem;font-size:1rem;color:var(--dark)">Move Task</h3>
      <div style="font-size:.78rem;color:var(--mid);margin-bottom:1rem">Select the new stage for this task:</div>
      <input type="hidden" id="pm-move-task-id">
      <input type="hidden" id="pm-move-current">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.5rem">
        ${buttons}
      </div>
      <div style="margin-top:.3rem;font-size:.73rem;color:var(--mid)">
        <span style="display:inline-block;width:10px;height:10px;background:var(--teal);border-radius:2px;vertical-align:middle;margin-right:.3rem"></span>Suggested next stage
      </div>
      <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem">
        <button class="btn btn-outline" onclick="document.getElementById('pm-move-modal').style.display='none'">Cancel</button>
      </div>
    </div>
  </div>`;
}

async function _pmDoMove(newStage){
  const modal=document.getElementById('pm-move-modal');
  const taskId=parseInt(modal.querySelector('#pm-move-task-id').value);
  modal.style.display='none';
  const panel=document.getElementById('pm-task-panel');
  if(panel)panel.remove();
  try{
    const mp=new URLSearchParams({action:'update_task',id:taskId,stage:newStage,actor_id:cur.id,actor_name:cur.name});
    await fetch(API_BASE+'?'+mp).then(x=>x.json());
    // Update local state
    const t=_pm.tasks.find(t=>t.id===taskId);
    if(t)t.stage=newStage;
    // Re-render current view
    if(_pm.view==='detail'&&_pm.activeProject) _pmProjectDetail(_pm.activeProject.id);
    else if(_pm.view==='board'&&_pm.activeProject) _pmProjectBoard(_pm.activeProject.id);
    else if(_pm.view==='mytasks') _pmMyTasks();
    else _renderPMBoard();
  }catch(e){alert('Error moving task: '+e.message);}
}

async function _pmDragDrop(event,toStage){
  const taskId=parseInt(event.dataTransfer.getData('taskId'));
  const fromStage=event.dataTransfer.getData('fromStage');
  if(!taskId||fromStage===toStage)return;
  try{
    const mp=new URLSearchParams({action:'update_task',id:taskId,stage:toStage,actor_id:cur.id,actor_name:cur.name});
    await fetch(API_BASE+'?'+mp).then(x=>x.json());
    const t=_pm.tasks.find(t=>t.id===taskId);
    if(t)t.stage=toStage;
    if(_pm.view==='detail'&&_pm.activeProject) _pmProjectDetail(_pm.activeProject.id);
    else if(_pm.view==='board'&&_pm.activeProject) _pmProjectBoard(_pm.activeProject.id);
    else if(_pm.view==='mytasks') _pmMyTasks();
    else _renderPMBoard();
  }catch(e){alert('Error moving task: '+e.message);}
}

// ── ADD PROJECT MODAL ─────────────────────────────────────────────────────

function _pmAddProjectModal(){
  const modal=document.getElementById('pm-proj-modal');
  if(!modal)return;
  modal.querySelector('#pm-proj-name').value='';
  modal.querySelector('#pm-proj-desc').value='';
  modal.querySelector('#pm-proj-due').value='';
  const eh=modal.querySelector('#pm-proj-est-hours');
  if(eh)eh.value='';
  const csel=modal.querySelector('#pm-proj-client');
  if(csel)csel.value='';
  modal.style.display='flex';
}

async function _pmArchiveProject(projectId, projectName){
  if(!confirm(`Archive "${projectName}"? It will be hidden from the projects list.`)) return;
  try{
    const r=await fetch(`${API_BASE}?action=archive_project&id=${projectId}`).then(x=>x.json());
    if(!r.success) throw new Error(r.error||'Failed');
    _pm.projects=_pm.projects.filter(p=>p.id!==projectId);
    _pmProjectsView();
  }catch(e){alert('Error: '+e.message);}
}

async function _pmSaveProject(){
  const name=document.getElementById('pm-proj-name').value.trim();
  const desc=document.getElementById('pm-proj-desc').value.trim();
  const billing=document.getElementById('pm-proj-billing').value;
  const due=document.getElementById('pm-proj-due').value;
  const clientEl=document.getElementById('pm-proj-client');
  const clientId=clientEl?clientEl.value:'';
  const estEl=document.getElementById('pm-proj-est-hours');
  const estHours=estEl&&estEl.value?estEl.value:'';
  if(!name){alert('Project name is required.');return;}
  try{
    const p=new URLSearchParams({action:'add_project',name,description:desc,billing_type:billing,due_date:due||'',estimated_hours:estHours,created_by:cur.db_id||parseInt((cur.id||'').replace(/^e/,''))||0,client_id:clientId||''});
    const r=await fetch(API_BASE+'?'+p).then(x=>x.json());
    if(!r.success)throw new Error(r.error||'Unknown error');
    document.getElementById('pm-proj-modal').style.display='none';
    await renderProjects();
  }catch(e){alert('Error: '+e.message);}
}

// ── ADD TASK MODAL ────────────────────────────────────────────────────────

    <div style="background:var(--bg);border-radius:14px;padding:1.75rem;max-width:440px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:90vh;overflow-y:auto">

      <select id="pm-task-proj" class="pm-inp">${projOpts}</select>
      <label class="pm-lbl">Task Title</label>
      <input id="pm-task-title" type="text" placeholder="What needs to be done?" class="pm-inp">
      <label class="pm-lbl">Description</label>
      <input id="pm-task-desc" type="text" placeholder="Optional" class="pm-inp">

      <label class="pm-lbl">Priority</label>
      <select id="pm-task-priority" class="pm-inp">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <label class="pm-lbl">Stage</label>
      <select id="pm-task-stage" class="pm-inp">
        ${STAGES.map(s=>`<option value="${s.key}">${s.label}</option>`).join('')}
      </select>

      <input id="pm-task-due" type="date" class="pm-inp">
      <div style="display:flex;gap:.6rem;justify-content:flex-end;margin-top:.5rem">
        <button class="btn btn-outline" onclick="document.getElementById('pm-task-modal').style.display='none'">Cancel</button>
        <button class="btn btn-primary" onclick="_pmSaveTask()">Add Task</button>
      </div>
    </div>
  </div>`;
}

function _pmAddTaskModal(projectId){
  const modal=document.getElementById('pm-task-modal');
  if(!modal)return;
  if(projectId){
    const sel=modal.querySelector('#pm-task-proj');
    if(sel){
      for(let i=0;i<sel.options.length;i++){
        if(parseInt(sel.options[i].value)===projectId){sel.selectedIndex=i;break;}
      }
    }
  }
  modal.querySelector('#pm-task-title').value='';
  modal.querySelector('#pm-task-desc').value='';
  modal.querySelector('#pm-task-assign').value='';
  modal.querySelector('#pm-task-stage').value='backlog';
  modal.querySelector('#pm-task-due').value='';
  modal.style.display='flex';
}

async function _pmSaveTask(){
  const projId=parseInt(document.getElementById('pm-task-proj').value);
  const title=document.getElementById('pm-task-title').value.trim();
  const desc=document.getElementById('pm-task-desc').value.trim();
  const assignSel=document.getElementById('pm-task-assign');
  const assignId=assignSel.value?parseInt(assignSel.value):null;
  const assignName=assignId?(assignSel.options[assignSel.selectedIndex].text||''):'';
  const priority=document.getElementById('pm-task-priority').value;
  const stage=document.getElementById('pm-task-stage').value;
  const due=document.getElementById('pm-task-due').value;
  if(!projId||!title){alert('Project and task title are required.');return;}
  try{
    const p=new URLSearchParams({action:'add_task',project_id:projId,title,description:desc||'',assigned_to:assignId||'',assigned_name:assignName||'',priority,stage,due_date:due||'',created_by:cur.db_id||parseInt((cur.id||'').replace(/^e/,''))||0,actor_name:cur.name});
    const r=await fetch(API_BASE+'?'+p).then(x=>x.json());
    if(!r.success)throw new Error(r.error||'Unknown error');
    document.getElementById('pm-task-modal').style.display='none';
    // Refresh
    if(_pm.view==='detail'&&_pm.activeProject) await _pmProjectDetail(_pm.activeProject.id);
    else if(_pm.view==='board'&&_pm.activeProject) _pmProjectBoard(_pm.activeProject.id);
    else if(_pm.view==='mytasks') _pmMyTasks();
    else await renderProjects();
  }catch(e){alert('Error: '+e.message);}
}

function escHtml(str){
  if(!str)return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── SETTINGS ──────────────────────────────────────────────────────────────
function renderSettings(){
  // Populate inputs from current GHL variables
  const si=document.getElementById("set-wh-submit");
  const ii=document.getElementById("set-wh-invite");
  const ni=document.getElementById("set-wh-notify");
  if(si) si.value=GHL_WEBHOOK||"";
  if(ii) ii.value=GHL_INVITE_WEBHOOK||"";
  if(ni) ni.value=GHL_NOTIFY_WEBHOOK||"";
}

async function saveSettingsWebhooks(){
  const submit=document.getElementById("set-wh-submit").value.trim();
  const invite=document.getElementById("set-wh-invite").value.trim();
  const notify=document.getElementById("set-wh-notify").value.trim();
  GHL_WEBHOOK=submit;GHL_INVITE_WEBHOOK=invite;GHL_NOTIFY_WEBHOOK=notify;
  try{
    await api({action:"update_settings",ghl_webhook_url:submit,ghl_invite_webhook_url:invite,ghl_notify_webhook_url:notify});
    const st=document.getElementById("set-wh-status");
    if(st){st.style.color="#10b981";st.textContent="✓ Webhook URLs saved.";}
    showToast("Webhook URLs saved.");
  }catch(e){alert("Error: "+e.message);}
}

async function saveSettingsGHL(){
  const key=document.getElementById("set-ghl-key").value.trim();
  const loc=document.getElementById("set-ghl-loc").value.trim();
  try{
    await api({action:"update_settings",ghl_api_key:key,ghl_location_id:loc});
    const st=document.getElementById("set-ghl-status");
    if(st){st.style.color="#10b981";st.textContent="✓ GHL API settings saved.";}
    showToast("GHL settings saved.");
  }catch(e){alert("Error: "+e.message);}

async function saveSettingsOT(){
  const threshold=document.getElementById("set-ot-threshold").value.trim();
  const multiplier=document.getElementById("set-ot-multiplier").value.trim();
  if(!threshold||!multiplier){alert("Enter both threshold and multiplier.");return;}
  try{
    await api({action:"update_settings",overtime_weekly_threshold:threshold,overtime_multiplier:multiplier});
    const st=document.getElementById("set-ot-status");
    if(st){st.style.color="#10b981";st.textContent="✓ Overtime rules saved.";}
    showToast("Overtime rules saved.");
  }catch(e){alert("Error: "+e.message);}
}

async function saveSettingsSecret(){
  const secret=document.getElementById("set-secret").value.trim();
  if(!secret){alert("Enter a webhook secret.");return;}
  try{
    await api({action:"update_secret",secret});
    const st=document.getElementById("set-secret-status");
    if(st){st.style.color="#10b981";st.textContent="✓ Webhook secret saved.";}
    showToast("Webhook secret saved.");
  }catch(e){alert("Error: "+e.message);}
}

// ── TEAM ADD/EDIT MEMBER MODAL ─────────────────────────────────────────────
function showAddMemberModal(){
  document.getElementById("member-modal-id").value="";
  document.getElementById("member-modal-name").value="";
  document.getElementById("member-modal-email").value="";
  document.getElementById("member-modal-pin").value="";
  document.getElementById("member-modal-pw").value="";
  document.getElementById("member-modal-role").value="employee";
  document.getElementById("member-modal-rate").value="";
  document.getElementById("member-modal-title").textContent="Add Team Member";
  document.getElementById("member-modal-pw-row").style.display="";
  const canSeePay=(cur.role==="admin"||cur.role==="hr");
  document.getElementById("member-modal-rate-row").style.display=canSeePay?"":"none";
  document.getElementById("member-modal-role").onchange=toggleMemberModalFields;
  const m=document.getElementById("member-modal");
  if(m) m.style.display="flex";
}

function editMember(uid){
  const e=EMPS.find(e=>e.id===uid);
  if(!e) return;
  document.getElementById("member-modal-id").value=uid;
  document.getElementById("member-modal-name").value=e.name||"";
  document.getElementById("member-modal-email").value=e.email||"";
  document.getElementById("member-modal-pin").value="";
  document.getElementById("member-modal-pw").value="";
  document.getElementById("member-modal-role").value=e.role||"employee";
  // Pre-populate pay rate from the employee's current timesheet rate if admin/HR
  const canSeePay=(cur.role==="admin"||cur.role==="hr");
  document.getElementById("member-modal-rate-row").style.display=canSeePay?"":"none";
  if(canSeePay){
    const d=gd(uid,pidx);
    document.getElementById("member-modal-rate").value=d.rate||"";
  }
  document.getElementById("member-modal-title").textContent="Edit "+e.name;
  toggleMemberModalFields();
  document.getElementById("member-modal-role").onchange=toggleMemberModalFields;
  const m=document.getElementById("member-modal");
  if(m) m.style.display="flex";
}

function toggleMemberModalFields(){
  // Password shown for all roles now — nothing to toggle
}

function closeMemberModal(){
  const m=document.getElementById("member-modal");
  if(m) m.style.display="none";
}

async function saveMember(){
  const id=document.getElementById("member-modal-id").value;
  const name=document.getElementById("member-modal-name").value.trim();
  const email=document.getElementById("member-modal-email").value.trim();
  const role=document.getElementById("member-modal-role").value;
  const pin=document.getElementById("member-modal-pin").value.trim();
  const pw=document.getElementById("member-modal-pw").value.trim();
  const rateEl=document.getElementById("member-modal-rate");
  const rateVal=rateEl&&rateEl.closest('#member-modal-rate-row')&&rateEl.closest('#member-modal-rate-row').style.display!=="none"?rateEl.value.trim():"";
  if(!name){alert("Name is required.");return;}
  if(pw&&pw.length<6){alert("Password must be at least 6 characters.");return;}
  try{
    let r;
    if(id){
      // Update existing
      const payload={action:"update_employee",id};
      if(name) payload.name=name;
      if(role) payload.role=role;
      if(pin)  payload.pin=pin;
      if(pw)   payload.password=pw;
      if(rateVal!=="") payload.rate=parseFloat(rateVal)||0;
      r=await api(payload);
      // Update local EMPS rate so gd() reads fresh value
      if(r.success&&rateVal!==""){const emp=EMPS.find(e=>e.id===id);if(emp)emp._rate=parseFloat(rateVal)||0;gd(id,pidx).rate=rateVal;}
      if(r.success){
        const emp=EMPS.find(e=>e.id===id);
        if(emp){emp.name=name;emp.role=role;if(pin){emp.pin_set=true;}if(pw){emp.password_set=true;}}
        showToast("Member updated.");
      }
    } else {
      // Add new
      if(role==="employee"){
        r=await api({action:"add_employee",name,email,pin:pin||""});
        if(r.success){EMPS.push({...r.employee,role:"employee",active:true,status:"active",password_set:false});}
      } else {
        r=await api({action:"add_manager",name,email,role,password:pw||""});
        if(r.success){EMPS.push({id:r.id,name,email,role,active:true,status:"active",pin_set:false,password_set:!!pw});}
      }
      if(r.success) showToast(`${name} added as ${role}.`);
    }
    if(r&&r.success){closeMemberModal();renderTeam();}
    else alert(r?.error||"Failed to save.");
  }catch(e){alert("Error: "+e.message);}
}

async function toggleMemberActive(uid,isActive){
  const emp=EMPS.find(e=>e.id===uid);
  const action=isActive?"deactivate":"reactivate";
  if(!confirm(`${isActive?"Deactivate":"Reactivate"} ${emp?.name||"this member"}?`)) return;
  try{
    const r=await api({action:"update_employee",id:uid,active:!isActive});
    if(r.success){
      if(emp) emp.active=!isActive;
      showToast(`${emp?.name||"Member"} ${isActive?"deactivated":"reactivated"}.`);
      renderTeam();
    } else alert(r.error||"Failed.");
  }catch(e){alert("Error: "+e.message);}
}
