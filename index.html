<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genhead Timesheet Portal 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#08153A;--teal:#03AD8F;--purple:#351D72;
  --lt-teal:#E0F7F4;--lt-purple:#EDE8F7;
  --white:#fff;--dark:#1a1a2e;--mid:#64748b;
  --border:#e2e8f0;--alt:#f8fafc;--bg:#fff;
  --danger:#ef4444;--success:#10b981;--gold:#f59e0b;
}
body{font-family:'DM Sans',sans-serif;background:#f1f5f9;color:var(--dark);min-height:100vh}
.screen{display:none}.screen.active{display:block}

/* LOGIN */
#s-login{background:var(--navy);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1rem;background-image:radial-gradient(ellipse at 60% 20%,rgba(3,173,143,.08) 0%,transparent 60%),radial-gradient(ellipse at 20% 80%,rgba(53,29,114,.15) 0%,transparent 55%)}
#s-login.active{display:flex}
.login-logo-wrap{display:flex;align-items:center;gap:.65rem;margin-bottom:.3rem}
.login-logo-mark{width:38px;height:38px;background:linear-gradient(135deg,var(--teal),#02c4a2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:#fff;letter-spacing:-1px;flex-shrink:0}
.login-brand{font-size:2rem;font-weight:700;color:#fff;letter-spacing:-1px;margin-bottom:0}
.login-brand span{color:var(--teal)}
.login-sub{font-size:.7rem;color:rgba(255,255,255,.3);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:2rem}
.login-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:1.75rem;width:100%;max-width:400px}
.login-card h2{color:#fff;font-size:1rem;font-weight:500;margin-bottom:1.25rem}
.emp-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:1.25rem}
.emp-btn{padding:.7rem;background:rgba(3,173,143,.1);border:1px solid rgba(3,173,143,.25);border-radius:9px;color:var(--teal);font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .15s;text-align:center}
.emp-btn:hover{background:rgba(3,173,143,.22);border-color:var(--teal);transform:translateY(-1px)}
.emp-btn.mgr{background:rgba(53,29,114,.2);border-color:rgba(53,29,114,.4);color:#a78bfa}
.emp-btn.mgr:hover{background:rgba(53,29,114,.32);border-color:#a78bfa}
.emp-btn.hr{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.25);color:var(--gold)}
.emp-btn.hr:hover{background:rgba(245,158,11,.2);border-color:var(--gold)}
.login-note{font-size:.7rem;color:rgba(255,255,255,.28);text-align:center;line-height:1.6}
.pin-digit{width:48px;height:56px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);border-radius:10px;color:#fff;font-size:1.5rem;text-align:center;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
.pin-digit:focus{border-color:var(--teal);background:rgba(3,173,143,.1)}
/* LOGIN FORM */
.lf-group{margin-bottom:1rem}
.lf-label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.45);margin-bottom:.45rem;font-weight:500}
.lf-select,.lf-input{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;padding:.65rem .85rem;font-size:.9rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s,background .15s;appearance:none;-webkit-appearance:none;cursor:pointer}
.lf-select:focus,.lf-input:focus{border-color:var(--teal);background:rgba(3,173,143,.08)}
.lf-select option{background:#1a2a4a;color:#fff}
.lf-input::placeholder{color:rgba(255,255,255,.25)}
.lf-select-wrap{position:relative}
.lf-select-wrap::after{content:'▾';position:absolute;right:.85rem;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);pointer-events:none;font-size:.9rem}
.name-suggestion{padding:.6rem .85rem;font-size:.9rem;color:#fff;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06)}
.name-suggestion:last-child{border-bottom:none}
.name-suggestion:hover,.name-suggestion.hovered{background:rgba(3,173,143,.25)}
@keyframes onAutoFillStart{from{}to{}}
#lf-name-input:-webkit-autofill{animation-name:onAutoFillStart;background-color:transparent!important;-webkit-text-fill-color:#fff!important}

/* APP SHELL */
#s-app.active{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--navy);padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.brand{font-size:1.05rem;font-weight:700;color:#fff;letter-spacing:-.5px}
.brand span{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:.75rem}
.topbar-user{font-size:.78rem;color:rgba(255,255,255,.5)}
.topbar-user strong{color:#fff}
.badge-role{font-size:.68rem;padding:.18rem .6rem;background:rgba(3,173,143,.2);border:1px solid rgba(3,173,143,.35);border-radius:20px;color:var(--teal);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.badge-role.mgr{background:rgba(53,29,114,.25);border-color:rgba(167,139,250,.4);color:#a78bfa}
.badge-role.hr{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4);color:var(--gold)}
.badge-role.admin{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.35);color:#f87171}
.btn-sm{padding:.32rem .8rem;border-radius:6px;font-size:.75rem;cursor:pointer;border:1px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.55);font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-sm:hover{border-color:rgba(255,255,255,.5);color:#fff}

.period-bar{background:var(--teal);padding:.42rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.period-label{font-size:.7rem;font-weight:500;color:rgba(0,0,0,.55);letter-spacing:.5px;text-transform:uppercase}
.period-sel{padding:.22rem .5rem;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.4);border-radius:5px;font-size:.75rem;color:var(--navy);cursor:pointer;font-family:'DM Sans',sans-serif}

.app-body{padding:1.25rem 1.5rem;flex:1;max-width:1200px;width:100%;margin:0 auto}

/* EMPLOYEE INFO */
.emp-info{background:var(--bg);border-radius:10px;border:1px solid var(--border);padding:.9rem 1.15rem;margin-bottom:.9rem;display:grid;grid-template-columns:2fr 1fr 1fr;gap:1rem;align-items:center}
.emp-name{font-size:1.05rem;font-weight:600;color:var(--navy)}
.emp-period{font-size:.75rem;color:var(--mid);margin-top:.15rem}
.field label{font-size:.65rem;text-transform:uppercase;letter-spacing:.5px;color:var(--mid);display:block;margin-bottom:.22rem}
.field input{width:100%;padding:.38rem .65rem;border:1px solid var(--border);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.88rem;color:var(--dark);background:var(--bg)}
.field input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(3,173,143,.1)}

/* WEEK */
.week-wrap{margin-bottom:.9rem;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.week-hdr{background:var(--purple);padding:.55rem 1rem;display:flex;align-items:center;justify-content:space-between}
.week-hdr h3{font-size:.75rem;font-weight:500;color:rgba(255,255,255,.9);text-transform:uppercase;letter-spacing:.5px}
.week-stats{display:flex;gap:1.25rem}
.wstat{font-size:.72rem;color:rgba(255,255,255,.5)}
.wstat strong{color:var(--teal)}
.col-hdrs{display:grid;grid-template-columns:1.6fr 2fr 1.1fr 0.9fr 0.9fr 0.9fr;gap:.4rem;padding:.3rem .9rem;background:var(--alt);border-bottom:1px solid var(--border)}
.col-hdr-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;color:var(--mid);text-align:center}
.col-hdr-lbl:first-child,.col-hdr-lbl:nth-child(2){text-align:left}
.day-block{background:var(--bg)}
.day-block:not(:last-child){border-bottom:1px solid var(--border)}
.day-hdr{padding:.4rem .9rem;background:var(--lt-teal);display:flex;align-items:center;gap:.65rem;border-bottom:1px solid var(--border)}
.day-hdr.wknd{background:#f3f0ff}
.day-nm{font-size:.75rem;font-weight:600;color:var(--navy);min-width:76px}
.day-hdr.wknd .day-nm{color:var(--purple)}
.day-dt{font-size:.68rem;color:var(--mid);font-family:'DM Mono',monospace}
.entry-row{display:grid;grid-template-columns:1.6fr 2fr 1.1fr 0.9fr 0.9fr 0.9fr;gap:.4rem;padding:.38rem .9rem;border-bottom:1px solid #f8fafc;align-items:center}
.entry-row:last-child{border-bottom:none}
.entry-row input{padding:.32rem .55rem;border:1px solid var(--border);border-radius:5px;font-size:.8rem;font-family:'DM Sans',sans-serif;color:var(--dark);background:var(--bg);width:100%}
.entry-row input:focus{outline:none;border-color:var(--teal)}
.entry-row input[type=number]{text-align:center}
.btype-sel{padding:.3rem .45rem;border:1px solid var(--border);border-radius:5px;font-size:.72rem;font-family:'DM Sans',sans-serif;color:var(--dark);background:var(--bg);width:100%;cursor:pointer}
.btype-sel:focus{outline:none;border-color:var(--teal)}
.btype-sel.bt-billable{background:#f0fdf4;border-color:#86efac;color:#166534}
.btype-sel.bt-nonbillable{background:#fef9c3;border-color:#fde047;color:#854d0e}
.btype-sel.bt-marketing{background:#f0f4ff;border-color:#a5b4fc;color:#3730a3}
.dpay{font-size:.8rem;font-weight:500;color:var(--teal);text-align:center;font-family:'DM Mono',monospace}
.dpay.dim{color:var(--mid);font-weight:400}

/* GRAND TOTAL */
.grand{background:var(--navy);border-radius:10px;padding:.9rem 1.15rem;margin-bottom:.6rem}
.grand-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem}
.grand-lbl{font-size:.78rem;color:rgba(255,255,255,.45)}
.grand-vals{display:flex;gap:2.5rem}
.gv .val{font-size:1.4rem;font-weight:600;color:var(--teal);font-family:'DM Mono',monospace}
.gv .lbl{font-size:.65rem;color:rgba(255,255,255,.32);text-transform:uppercase;letter-spacing:.4px;margin-top:.1rem}

/* BILLING BREAKDOWN */
.billing-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.9rem}
.bb-card{border-radius:8px;padding:.6rem .85rem}
.bb-card.bb-bill{background:#f0fdf4;border:1px solid #86efac}
.bb-card.bb-nb{background:#fef9c3;border:1px solid #fde047}
.bb-card.bb-mkt{background:#f0f4ff;border:1px solid #a5b4fc}
.bb-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;margin-bottom:.2rem;font-weight:500}
.bb-card.bb-bill .bb-lbl{color:#166534}
.bb-card.bb-nb .bb-lbl{color:#854d0e}
.bb-card.bb-mkt .bb-lbl{color:#3730a3}
.bb-val{font-size:1.05rem;font-weight:600;font-family:'DM Mono',monospace}
.bb-card.bb-bill .bb-val{color:#166534}
.bb-card.bb-nb .bb-val{color:#854d0e}
.bb-card.bb-mkt .bb-val{color:#3730a3}
.bb-sub{font-size:.68rem;margin-top:.1rem}
.bb-card.bb-bill .bb-sub{color:#4ade80}
.bb-card.bb-nb .bb-sub{color:#ca8a04}
.bb-card.bb-mkt .bb-sub{color:#818cf8}

/* BUTTONS */
.action-bar{display:flex;gap:.65rem;justify-content:flex-end;margin-bottom:1.5rem}
.btn{padding:.52rem 1.15rem;border-radius:8px;font-size:.84rem;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:#029e83;transform:translateY(-1px)}
.btn-outline{background:var(--bg);color:var(--dark);border:1px solid var(--border)}
.btn-outline:hover{background:var(--alt)}
.btn-purple{background:var(--purple);color:#fff}
.btn-purple:hover{background:#2d186a}

/* BADGE */
.badge{display:inline-block;padding:.15rem .58rem;border-radius:20px;font-size:.68rem;font-weight:500}
.b-pend{background:#fef3c7;color:#92400e}
.b-sub{background:#d1fae5;color:#065f46}
.b-prog{background:#ede9fe;color:#5b21b6}

/* DASHBOARD */
.tab-bar{display:flex;gap:.4rem;margin-bottom:.9rem}
.tab{padding:.4rem .9rem;border-radius:7px;font-size:.8rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--mid);font-family:'DM Sans',sans-serif;transition:all .15s}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.dash-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem}
.dash-top h2{font-size:1.05rem;font-weight:600;color:var(--navy)}
.dash-top p{font-size:.75rem;color:var(--mid);margin-top:.15rem}
.conf{display:inline-block;padding:.15rem .6rem;background:#fee2e2;border:1px solid #fecaca;border-radius:5px;font-size:.65rem;color:#991b1b;letter-spacing:.4px;text-transform:uppercase;font-weight:500}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-bottom:.9rem}
.mc{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.8rem .95rem}
.mc.accent{border-left:3px solid var(--teal);border-radius:0 10px 10px 0}
.mc .ml{font-size:.65rem;text-transform:uppercase;letter-spacing:.4px;color:var(--mid);margin-bottom:.25rem}
.mc .mv{font-size:1.4rem;font-weight:600;color:var(--navy);font-family:'DM Mono',monospace}
.mc .ms{font-size:.7rem;color:var(--teal);margin-top:.15rem}

/* BILLING SUMMARY TABLE */
.rpt-tab{padding:.38rem .9rem;border-radius:7px;font-size:.78rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--mid);font-family:'DM Sans',sans-serif;transition:all .15s}
.rpt-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.rpt-tab:hover:not(.active){background:var(--hover)}
.rpt-section{display:none}.rpt-section.show{display:block}
.rpt-card{background:var(--bg);border-radius:10px;border:1px solid var(--border);padding:1.1rem;margin-bottom:.9rem}
.rpt-card h3{margin:0 0 .75rem;font-size:.9rem;color:var(--dark);font-weight:600}
.proj-bar-wrap{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:.3rem}
.proj-bar{height:8px;border-radius:4px;transition:width .4s}
.billing-tbl{background:var(--bg);border-radius:10px;border:1px solid var(--border);overflow:hidden;margin-bottom:.9rem}
.billing-tbl table{width:100%;border-collapse:collapse;font-size:.8rem}
.billing-tbl thead tr{background:var(--navy)}
.billing-tbl thead th{padding:.5rem .85rem;text-align:left;font-weight:500;color:rgba(255,255,255,.7);font-size:.64rem;text-transform:uppercase;letter-spacing:.4px}
.billing-tbl tbody tr{border-bottom:1px solid #f1f5f9}
.billing-tbl tbody tr:hover{background:var(--alt)}
.billing-tbl tbody td{padding:.5rem .85rem;color:var(--dark)}
.billing-tbl tfoot tr{background:#f8fafc;border-top:2px solid var(--border)}
.billing-tbl tfoot td{padding:.5rem .85rem;font-weight:600;color:var(--navy);font-size:.8rem}

.master-tbl{background:var(--bg);border-radius:10px;border:1px solid var(--border);overflow:hidden;margin-bottom:.9rem}
.master-tbl table{width:100%;border-collapse:collapse;font-size:.8rem}
.master-tbl thead tr{background:var(--navy)}
.master-tbl thead th{padding:.58rem .95rem;text-align:left;font-weight:500;color:rgba(255,255,255,.7);font-size:.66rem;text-transform:uppercase;letter-spacing:.4px}
.master-tbl tbody tr{border-bottom:1px solid #f1f5f9;transition:background .12s}
.master-tbl tbody tr:hover{background:var(--alt)}
.master-tbl tbody td{padding:.58rem .95rem;color:var(--dark)}

/* PROJECT BOARD */
/* ── Stage color tokens ─────────────────────────────────────── */
:root{
  --stage-backlog:#94a3b8;   --stage-backlog-bg:rgba(148,163,184,.08);
  --stage-todo:#6366f1;      --stage-todo-bg:rgba(99,102,241,.08);
  --stage-inprogress:#f59e0b;--stage-inprogress-bg:rgba(245,158,11,.08);
  --stage-inreview:#a855f7;  --stage-inreview-bg:rgba(168,85,247,.08);
  --stage-done:#10b981;      --stage-done-bg:rgba(16,185,129,.08);
}
.pm-board{display:grid;grid-template-columns:repeat(5,1fr);gap:.65rem;align-items:start;overflow-x:auto;padding-bottom:.5rem}
@media(max-width:900px){.pm-board{grid-template-columns:repeat(3,minmax(180px,1fr));}}
@media(max-width:600px){.pm-board{grid-template-columns:repeat(2,minmax(160px,1fr));}}
.pm-col{background:var(--hover);border-radius:10px;padding:.6rem;min-height:160px}
.pm-col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.55rem;padding:.45rem .5rem .45rem .7rem;border-radius:7px;margin:-0.1rem -.1rem .55rem}
.pm-col-header.stage-backlog  {background:var(--stage-backlog-bg);  border-left:3px solid var(--stage-backlog);}
.pm-col-header.stage-todo     {background:var(--stage-todo-bg);      border-left:3px solid var(--stage-todo);}
.pm-col-header.stage-inprogress{background:var(--stage-inprogress-bg);border-left:3px solid var(--stage-inprogress);}
.pm-col-header.stage-inreview {background:var(--stage-inreview-bg);  border-left:3px solid var(--stage-inreview);}
.pm-col-header.stage-done     {background:var(--stage-done-bg);      border-left:3px solid var(--stage-done);}
.pm-col-label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pm-col-label.stage-backlog  {color:var(--stage-backlog);}
.pm-col-label.stage-todo     {color:var(--stage-todo);}
.pm-col-label.stage-inprogress{color:var(--stage-inprogress);}
.pm-col-label.stage-inreview {color:var(--stage-inreview);}
.pm-col-label.stage-done     {color:var(--stage-done);}
.pm-col-count{font-size:.72rem;color:var(--mid);background:var(--bg);border-radius:20px;padding:.1rem .45rem;border:1px solid var(--border)}
.pm-cards{display:flex;flex-direction:column;gap:.5rem}
.pm-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.65rem .7rem .65rem .85rem;cursor:pointer;position:relative;transition:box-shadow .15s,border-color .15s;border-left-width:3px}
.pm-card.stage-backlog  {border-left-color:var(--stage-backlog);}
.pm-card.stage-todo     {border-left-color:var(--stage-todo);}
.pm-card.stage-inprogress{border-left-color:var(--stage-inprogress);}
.pm-card.stage-inreview {border-left-color:var(--stage-inreview);}
.pm-card.stage-done     {border-left-color:var(--stage-done);}
.pm-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.1)}
.pm-card.stage-backlog:hover  {box-shadow:0 2px 10px rgba(148,163,184,.2);}
.pm-card.stage-todo:hover     {box-shadow:0 2px 10px rgba(99,102,241,.18);}
.pm-card.stage-inprogress:hover{box-shadow:0 2px 10px rgba(245,158,11,.18);}
.pm-card.stage-inreview:hover {box-shadow:0 2px 10px rgba(168,85,247,.18);}
.pm-card.stage-done:hover     {box-shadow:0 2px 10px rgba(16,185,129,.18);}
.pm-card:hover .pm-move-btn{opacity:1}
.pm-card-proj{font-size:.68rem;color:var(--mid);margin-bottom:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-card-title{font-size:.82rem;font-weight:500;color:var(--dark);line-height:1.35;margin-bottom:.45rem}
.pm-card-meta{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.pm-pri-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pm-avatar{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:.62rem;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pm-move-btn{position:absolute;top:.5rem;right:.5rem;opacity:0;background:var(--navy);color:#fff;border:none;border-radius:5px;font-size:.68rem;padding:.2rem .45rem;cursor:pointer;transition:opacity .15s}
.pm-detail-grid{display:flex;flex-direction:column;gap:.75rem}
.pm-detail-section{background:var(--hover);border-radius:10px;padding:.65rem}
.pm-activity{padding:.4rem 0;border-bottom:1px solid var(--border);opacity:.7}
.pm-comment{padding:.4rem 0;border-bottom:1px solid var(--border)}
.pm-cmt-who{font-size:.75rem;font-weight:600;color:var(--navy)}
.pm-cmt-time{font-size:.7rem;color:var(--mid)}
.pm-cmt-text{font-size:.82rem;color:var(--dark);margin-top:.15rem}
.pm-stage-btn{padding:.55rem .65rem;border:2px solid var(--border);border-radius:7px;background:var(--hover);color:var(--dark);font-size:.8rem;cursor:pointer;text-align:left;transition:all .15s;border-left-width:4px}
.pm-stage-btn[data-stage="backlog"]  {border-left-color:var(--stage-backlog);}
.pm-stage-btn[data-stage="todo"]     {border-left-color:var(--stage-todo);}
.pm-stage-btn[data-stage="inprogress"]{border-left-color:var(--stage-inprogress);}
.pm-stage-btn[data-stage="inreview"] {border-left-color:var(--stage-inreview);}
.pm-stage-btn[data-stage="done"]     {border-left-color:var(--stage-done);}
.pm-stage-btn:hover:not(:disabled){filter:brightness(.96);box-shadow:0 1px 6px rgba(0,0,0,.1)}
.pm-stage-btn:disabled{opacity:.4;cursor:not-allowed}
.pm-stage-current{opacity:.45;cursor:not-allowed}
.pm-stage-suggested{box-shadow:0 0 0 2px currentColor;font-weight:600}
.btype-tag{display:inline-block;font-size:.65rem;font-weight:600;padding:.1rem .38rem;border-radius:4px;border:1px solid transparent}
.btype-tag.bt-billable{background:#f0fdf4;border-color:#86efac;color:#166534}
.btype-tag.bt-nonbillable{background:#fef9c3;border-color:#fde047;color:#854d0e}
.btype-tag.bt-marketing{background:#f0f4ff;border-color:#a5b4fc;color:#3730a3}
.pm-lbl{display:block;font-size:.78rem;font-weight:600;color:var(--dark);margin-bottom:.25rem;margin-top:.65rem}
.pm-proj-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;cursor:pointer;transition:box-shadow .15s,border-color .15s;display:flex;flex-direction:column;gap:.25rem}
.pm-proj-card:hover{border-color:var(--teal);box-shadow:0 4px 16px rgba(3,173,143,.13)}
.pm-proj-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.2rem}
.pm-proj-card-name{font-size:.95rem;font-weight:600;color:var(--dark);line-height:1.3}
.pm-proj-card-client{font-size:.72rem;color:var(--teal);font-weight:500;white-space:nowrap;margin-top:.15rem}
.pm-proj-card-desc{font-size:.78rem;color:var(--mid);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pm-inp{width:100%;background:var(--hover);border:1px solid var(--border);border-radius:8px;padding:.5rem .75rem;color:var(--dark);font-size:.85rem;box-sizing:border-box;font-family:'DM Sans',sans-serif}
.pm-inp:focus{outline:none;border-color:var(--teal)}

/* GHL */
.ghl-panel{background:var(--bg);border-radius:10px;border:1px solid var(--border);overflow:hidden;margin-bottom:.9rem}
.ghl-header{background:var(--navy);padding:.62rem 1rem;display:flex;align-items:center;justify-content:space-between}
.ghl-header h3{font-size:.8rem;font-weight:500;color:#fff}
.ghl-badge{font-size:.65rem;padding:.15rem .58rem;background:rgba(3,173,143,.25);border:1px solid rgba(3,173,143,.4);border-radius:20px;color:var(--teal)}
.ghl-body{padding:1rem}
.ghl-field{margin-bottom:.75rem}
.ghl-field label{font-size:.68rem;text-transform:uppercase;letter-spacing:.4px;color:var(--mid);display:block;margin-bottom:.22rem}
.ghl-input{width:100%;padding:.42rem .72rem;border:1px solid var(--border);border-radius:7px;font-size:.84rem;font-family:'DM Sans',sans-serif;color:var(--dark);background:var(--alt)}
.ghl-input:focus{outline:none;border-color:var(--teal)}
.ghl-status{display:flex;align-items:center;gap:.5rem;padding:.48rem .75rem;border-radius:7px;font-size:.78rem;margin-top:.5rem}
.ghl-ok{background:#d1fae5;color:#065f46}
.ghl-warn{background:#fef3c7;color:#92400e}
.ghl-err{background:#fee2e2;color:#991b1b}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-g{background:#10b981}.dot-y{background:#f59e0b}.dot-r{background:#ef4444}
.code-block{background:var(--alt);border:1px solid var(--border);border-radius:7px;padding:.6rem .85rem;font-size:.73rem;font-family:'DM Mono',monospace;color:var(--dark);margin-top:.45rem;word-break:break-all;line-height:1.6}

/* SETUP STEPS */
.setup-steps{}
.step{display:flex;gap:.85rem;padding:.9rem 1rem;border-bottom:1px solid var(--border)}
.step:last-child{border-bottom:none}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-size:.75rem;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:.05rem}
.step h4{font-size:.84rem;font-weight:600;color:var(--navy);margin-bottom:.28rem}
.step p{font-size:.76rem;color:var(--mid);line-height:1.6}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--navy);color:#fff;padding:.8rem 1.15rem;border-radius:10px;font-size:.84rem;display:flex;align-items:center;gap:.65rem;transform:translateY(80px);opacity:0;transition:all .35s cubic-bezier(.34,1.56,.64,1);z-index:999;max-width:340px;border-left:3px solid var(--teal);box-shadow:0 8px 32px rgba(8,21,58,.25)}
.toast.show{transform:translateY(0);opacity:1}
.toast-icon{color:var(--teal);font-size:14px}
</style>

<div class="toast" id="toast"><span class="toast-icon">&#10003;</span><span id="toast-msg"></span></div>

<script>
// ── BILLING TYPES ──────────────────────────────────────────────────────────
// To add a new type in the future: add one object to this array.
// key   = stored value (keep stable — changing breaks saved data)
// label = what shows in the dropdown
// css   = CSS class suffix for color-coding
const BILLING_TYPES = [
  { key: "billable",    label: "Billable",      css: "bt-billable"    },
  { key: "nonbillable", label: "Non-Billable",  css: "bt-nonbillable" },
  { key: "marketing",   label: "Marketing",     css: "bt-marketing"   }
];
const BT_DEFAULT = "billable";

function btLabel(key){ const t=BILLING_TYPES.find(b=>b.key===key); return t?t.label:key; }
function btCss(key){   const t=BILLING_TYPES.find(b=>b.key===key); return t?t.css:"";    }

// ── CONFIG ─────────────────────────────────────────────────────────────────
const PERIODS=["Apr 27 - May 10","May 11 - May 24","May 25 - Jun 07","Jun 08 - Jun 21","Jun 22 - Jul 05","Jul 06 - Jul 19","Jul 20 - Aug 02","Aug 03 - Aug 16","Aug 17 - Aug 30","Aug 31 - Sep 13","Sep 14 - Sep 27","Sep 28 - Oct 11","Oct 12 - Oct 25","Oct 26 - Nov 08","Nov 09 - Nov 22","Nov 23 - Dec 06","Dec 07 - Dec 20","Dec 21 - Jan 03"];
const PSTARTS=[[2026,3,27],[2026,4,11],[2026,4,25],[2026,5,8],[2026,5,22],[2026,6,6],[2026,6,20],[2026,7,3],[2026,7,17],[2026,7,31],[2026,8,14],[2026,8,28],[2026,9,12],[2026,9,26],[2026,10,9],[2026,10,23],[2026,11,7],[2026,11,21]];
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
let EMPS=[];    // populated from DB on load
let CLIENTS=[]; // populated from DB on load

// ── API HELPER ─────────────────────────────────────────────────────────────
const API_BASE="api.php";
function api(body){
  const form=new URLSearchParams();
  for(const[k,v]of Object.entries(body)) form.append(k,typeof v==="object"?JSON.stringify(v):v);
  return fetch(API_BASE,{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:form.toString()
  }).then(r=>r.json()).then(d=>({...d,ok:d.success===true||d.ok===true}));
}

let GHL_WEBHOOK=localStorage.getItem("ghl_webhook")||"";
let GHL_INVITE_WEBHOOK="";
let GHL_NOTIFY_WEBHOOK="";
let cur=null,pidx=0;
const store={};

function dk(uid,p){return uid+"_"+p;}
function gd(uid,p){
  const k=dk(uid,p);
  if(!store[k]){
    store[k]={
      rate:"",
      // Each entry now includes billingType (defaulting to "billable")
      entries:Array.from({length:14*3},(_,i)=>({day:Math.floor(i/3),ei:i%3,co:"",del:"",hrs:"",bt:BT_DEFAULT})),
      submitted:false
    };
  }
  return store[k];
}
function pfl(v){const n=parseFloat(v);return isNaN(n)?0:n;}
function fm(n){return"$"+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/,",");}
function pdate(pi,offset){const[y,m,d]=PSTARTS[pi];const dt=new Date(y,m,d);dt.setDate(dt.getDate()+offset);return dt;}

// ── BILLING TYPE DROPDOWN HTML ─────────────────────────────────────────────
function btSelect(dayIdx, ei, currentVal, readonly){
  if(readonly){
    return `<div class="btype-sel ${btCss(currentVal)}" style="padding:.3rem .45rem;font-size:.72rem;border-radius:5px;text-align:center">${btLabel(currentVal)}</div>`;
  }
  const opts = BILLING_TYPES.map(t=>
    `<option value="${t.key}"${t.key===currentVal?" selected":""}>${t.label}</option>`
  ).join("");
  return `<select class="btype-sel ${btCss(currentVal)}" onchange="upBT(${dayIdx},${ei},this.value);this.className='btype-sel '+btCss(this.value)">${opts}</select>`;
}

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo({top:0,behavior:"instant"});}

// ── AUTH STATE ─────────────────────────────────────────────────────────────
let _pinUser=null, _pinMode='enter'; // modes: 'enter','setup'
let _resetToken=null, _resetUid=null;
let _selectedEmpId=null; // tracks confirmed autocomplete selection

// ── NAME AUTOCOMPLETE HELPERS ────────────────────────────────────────────
function buildEmpLabel(e){
  const roleLabel={employee:'Employee',manager:'Manager',hr:'HR',admin:'Admin'};
  const nameCounts={};
  EMPS.forEach(x=>{ nameCounts[x.name]=(nameCounts[x.name]||0)+1; });
  return nameCounts[e.name]>1 ? `${e.name} (${roleLabel[e.role]||e.role})` : e.name;
}
function renderNameSuggestions(query){
  const list=document.getElementById('lf-name-list');
  if(!list) return;
  const q=query.trim().toLowerCase();
  if(q.length===0){ list.style.display='none'; return; }
  const matches=EMPS.filter(e=>buildEmpLabel(e).toLowerCase().includes(q))
    .sort((a,b)=>{
      const ra=a.role==="employee"?0:1, rb=b.role==="employee"?0:1;
      return ra!==rb ? ra-rb : a.name.localeCompare(b.name);
    }).slice(0,8);
  if(matches.length===0){ list.style.display='none'; return; }
  list.innerHTML=matches.map(e=>{
    const label=buildEmpLabel(e);
    return `<div class="name-suggestion" data-id="${e.id}" data-label="${label.replace(/"/g,'&quot;')}">${label}</div>`;
  }).join('');
  list.style.display='block';
  list.querySelectorAll('.name-suggestion').forEach(el=>{
    el.addEventListener('mousedown',function(ev){
      ev.preventDefault();
      selectNameSuggestion(this.dataset.id, this.dataset.label);
    });
  });
}
function selectNameSuggestion(id, label){
  _selectedEmpId=id;
  const inp=document.getElementById('lf-name-input');
  if(inp) inp.value=label;
  const list=document.getElementById('lf-name-list');
  if(list) list.style.display='none';
  const hint=document.getElementById('lf-name-hint');
  if(hint) hint.style.display='none';
  const u=EMPS.find(e=>e.id===id);
  if(u) lfNameChangeById(u); else resetLevelField();
}

// ── BUILD LOGIN FORM (called once immediately, before EMPS loads) ────────
function buildLoginForm(){
  // Inject entire form via JS so browser never sees it during initial parse
  document.getElementById('lf-mount').innerHTML=`
    <h2>Sign in to your account</h2>
    <div class="lf-group" style="position:relative">
      <label class="lf-label">Name</label>
      <input type="text" style="display:none" aria-hidden="true" tabindex="-1" name="fake-name-absorb">
      <input type="text" class="lf-input" id="lf-name-input" placeholder="Start typing your name…" autocomplete="new-password" autocorrect="off" spellcheck="false" name="search-name">
      <div id="lf-name-list" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:999;background:#1a2a3a;border:1.5px solid rgba(3,173,143,.5);border-radius:0 0 10px 10px;max-height:220px;overflow-y:auto"></div>
      <div id="lf-name-hint" style="font-size:.7rem;color:rgba(255,255,255,.3);margin-top:.35rem;display:none">Select your name from the list ↑</div>
    </div>
    <div class="lf-group" id="lf-level-group">
      <label class="lf-label">Access Level</label>
      <select class="lf-select" id="lf-level" autocomplete="off">
        <option value="">— Select access level —</option>
      </select>
      <div id="lf-level-display" style="display:none;width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(3,173,143,.4);border-radius:10px;color:#fff;padding:.65rem .85rem;font-size:.9rem;"></div>
    </div>
    <div class="lf-group" id="lf-pin-group" style="display:none">
      <label class="lf-label" id="lf-pin-label">PIN</label>
      <div style="display:flex;gap:.5rem;justify-content:center;margin-top:.4rem">
        <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit" id="pin0" autocomplete="off">
        <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit" id="pin1" autocomplete="off">
        <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit" id="pin2" autocomplete="off">
        <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit" id="pin3" autocomplete="off">
      </div>
    </div>
    <div class="lf-group" id="lf-pw-group" style="display:none">
      <label class="lf-label" id="lf-pw-label">Password</label>
      <input type="password" class="lf-input" id="lf-password" placeholder="Enter your password" autocomplete="new-password">
    </div>
    <div class="lf-group" id="lf-pw-confirm-group" style="display:none">
      <label class="lf-label">Confirm Password</label>
      <input type="password" class="lf-input" id="lf-password-confirm" placeholder="Re-enter your password" autocomplete="new-password">
    </div>
    <div id="lf-pin-confirm" style="display:none">
      <div class="lf-group">
        <label class="lf-label">Confirm PIN</label>
        <div style="display:flex;gap:.5rem;justify-content:center;margin-top:.4rem">
          <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit" id="pin4" autocomplete="off">
          <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit" id="pin5" autocomplete="off">
          <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit" id="pin6" autocomplete="off">
          <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit" id="pin7" autocomplete="off">
        </div>
      </div>
    </div>
    <div id="lf-error" style="color:#f87171;font-size:.78rem;text-align:center;min-height:1.2em;margin:.25rem 0"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:.25rem" id="lf-submit" disabled>Sign In</button>
    <div style="text-align:center;margin-top:.85rem">
      <span id="lf-forgot" style="font-size:.75rem;color:rgba(255,255,255,.35);cursor:pointer;text-decoration:underline;display:none">Forgot password?</span>
    </div>`;
  // Wire up events after injection
  const nameInp=document.getElementById('lf-name-input');
  nameInp.addEventListener('input',function(){
    _selectedEmpId=null; resetLevelField(); renderNameSuggestions(this.value);
    const q=this.value.trim().toLowerCase();
    const hint=document.getElementById('lf-name-hint');
    if(q.length>0){
      const matches=EMPS.filter(e=>buildEmpLabel(e).toLowerCase().includes(q));
      if(matches.length===1){
        selectNameSuggestion(matches[0].id, buildEmpLabel(matches[0]));
      } else {
        if(hint) hint.style.display='block';
      }
    } else {
      if(hint) hint.style.display='none';
    }
  });
  nameInp.addEventListener('blur',function(){ setTimeout(()=>{ const l=document.getElementById('lf-name-list'); if(l) l.style.display='none'; },150); });
  // Chrome ignores autocomplete="off" — detect autofill (contains @ or looks like email) and clear it
  nameInp.addEventListener('change',function(){
    if(this.value.includes('@')||this.value.includes('.')){
      this.value=''; _selectedEmpId=null; resetLevelField();
      const hint=document.getElementById('lf-name-hint'); if(hint) hint.style.display='none';
    }
  });
  // Also watch for autofill via animation trick
  nameInp.addEventListener('animationstart',function(e){
    if(e.animationName==='onAutoFillStart'){ this.value=''; _selectedEmpId=null; resetLevelField(); }
  });
  nameInp.addEventListener('keydown',function(e){
    const list=document.getElementById('lf-name-list');
    if(!list||list.style.display==='none') return;
    const items=[...list.querySelectorAll('.name-suggestion')];
    const cur=list.querySelector('.name-suggestion.hovered');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      let idx=items.indexOf(cur);
      idx=e.key==='ArrowDown' ? Math.min(idx+1,items.length-1) : Math.max(idx-1,0);
      items.forEach(i=>i.classList.remove('hovered')); items[idx].classList.add('hovered');
    } else if(e.key==='Enter'&&cur){
      e.preventDefault(); selectNameSuggestion(cur.dataset.id,cur.dataset.label);
    } else if(e.key==='Escape'){ list.style.display='none'; }
  });
  document.getElementById('lf-level').addEventListener('change', lfLevelChange);
  document.getElementById('lf-submit').addEventListener('click', lfSubmit);
  document.getElementById('lf-forgot').addEventListener('click', showForgotPin);
  document.getElementById('lf-password').addEventListener('keydown', e=>{ if(e.key==='Enter') lfSubmit(); });
  document.getElementById('lf-password-confirm').addEventListener('keydown', e=>{ if(e.key==='Enter') lfSubmit(); });
  [0,1,2,3].forEach(i=>{
    document.getElementById('pin'+i).addEventListener('input', ()=>pinNext(i));
    document.getElementById('pin'+i).addEventListener('keydown', e=>pinKeydown(e,i));
  });
  [4,5,6,7].forEach(i=>{
    document.getElementById('pin'+i).addEventListener('input', ()=>pinNext(i));
    document.getElementById('pin'+i).addEventListener('keydown', e=>pinKeydown(e,i));
  });
}

function resetLevelField(){
  const levelEl=document.getElementById("lf-level");
  levelEl.innerHTML='<option value="">— Select access level —</option>';
  levelEl.style.display="";
  document.getElementById("lf-level-display").style.display="none";
  document.getElementById("lf-pin-group").style.display="none";
  document.getElementById("lf-pw-group").style.display="none";
  document.getElementById("lf-pin-confirm").style.display="none";
  document.getElementById("lf-forgot").style.display="none";
  document.getElementById("lf-error").textContent="";
  document.getElementById("lf-submit").disabled=true;
}

function lfNameChangeById(u){
  resetLevelField();
  const levelEl=document.getElementById("lf-level");
  const levels=[];
  if(u.role==="employee") levels.push({val:"employee",label:"Employee"});
  if(u.role==="manager") levels.push({val:"manager",label:"Manager"});
  if(u.role==="hr") levels.push({val:"hr",label:"HR"});
  if(u.role==="admin") levels.push({val:"admin",label:"Admin"});
  levels.forEach(l=>{
    const o=document.createElement("option");
    o.value=l.val; o.textContent=l.label; levelEl.appendChild(o);
  });
  if(levels.length===1){
    levelEl.style.display="none";
    const disp=document.getElementById("lf-level-display");
    disp.textContent=levels[0].label;
    disp.style.display="";
    levelEl.value=levels[0].val;
    lfLevelChange();
  } else {
    levelEl.style.display="";
    document.getElementById("lf-level-display").style.display="none";
  }
}

function lfNameChange(){
  // Legacy — no longer used (autocomplete input replaces select)
}

function lfLevelChange(){

function lfSubmit(){
  const uid=_selectedEmpId;
  const level=document.getElementById("lf-level").value;
  document.getElementById("lf-error").textContent="";
  if(!uid||!level){document.getElementById("lf-error").textContent="Please select your name from the list and access level.";return;}
  const u=EMPS.find(e=>e.id===uid);
  if(!u) return;
  _pinUser=u;
  const errEl=document.getElementById("lf-error");
  const submitBtn=document.getElementById("lf-submit");

  if(level==="employee"){
    // Employees now use password — same flow as manager/hr/admin below
    const pw=document.getElementById("lf-password").value;
    if(!pw){errEl.textContent="Please enter your password.";return;}

    if(_pinMode==='setup'){
      const pwConf=document.getElementById("lf-password-confirm").value;
      if(pw.length<6){errEl.textContent="Password must be at least 6 characters.";return;}
      if(pw!==pwConf){errEl.textContent="Passwords don't match — try again.";document.getElementById("lf-password-confirm").value="";return;}
      submitBtn.disabled=true;
      fetch(`api.php?action=set_password&id=${encodeURIComponent(uid)}&pw=${encodeURIComponent(pw)}`).then(r=>r.json()).then(r=>{
        submitBtn.disabled=false;
        if(r.success){if(u)u.password_set=true;doLogin(u);}
        else errEl.textContent=r.error||"Error setting password.";
      }).catch(()=>{submitBtn.disabled=false;errEl.textContent="Network error — try again.";});
    } else {
      submitBtn.disabled=true;
      fetch(`api.php?action=verify_password&id=${encodeURIComponent(uid)}&pw=${encodeURIComponent(pw)}`).then(r=>r.json()).then(r=>{
        submitBtn.disabled=false;
        if(r.success){
          if(u)u.password_set=true;
          doLogin(u);
        } else if(r.needs_setup){
          _pinMode='setup';
          document.getElementById("lf-pw-label").textContent="Create your password";
          document.getElementById("lf-password").placeholder="Choose a password (min 6 chars)";
          document.getElementById("lf-password").value="";
          document.getElementById("lf-pw-confirm-group").style.display="";
          document.getElementById("lf-forgot").style.display="none";
          errEl.textContent="No password set yet — please create one.";
          setTimeout(()=>document.getElementById("lf-password").focus(),100);
        } else {
          errEl.textContent="Incorrect password.";
          document.getElementById("lf-password").value="";
          setTimeout(()=>document.getElementById("lf-password").focus(),100);
        }
      }).catch(()=>{submitBtn.disabled=false;errEl.textContent="Network error — try again.";});
    }

  } else {
    // Manager / HR / Admin — password login
    const pw=document.getElementById("lf-password").value;
    if(!pw){errEl.textContent="Please enter your password.";return;}

    if(_pinMode==='setup'){
      // Already in setup mode — confirm the new password
      const pwConf=document.getElementById("lf-password-confirm").value;
      if(pw.length<6){errEl.textContent="Password must be at least 6 characters.";return;}
      if(pw!==pwConf){errEl.textContent="Passwords don't match — try again.";document.getElementById("lf-password-confirm").value="";return;}
      submitBtn.disabled=true;
      fetch(`api.php?action=set_password&id=${encodeURIComponent(uid)}&pw=${encodeURIComponent(pw)}`).then(r=>r.json()).then(r=>{
        submitBtn.disabled=false;
        if(r.success){if(u)u.password_set=true;doLogin(u);}
        else errEl.textContent=r.error||"Error setting password.";
      }).catch(()=>{submitBtn.disabled=false;errEl.textContent="Network error — try again.";});

    } else {
      // Normal login — submit password; server tells us if setup is needed
      submitBtn.disabled=true;
      fetch(`api.php?action=verify_password&id=${encodeURIComponent(uid)}&pw=${encodeURIComponent(pw)}`).then(r=>r.json()).then(r=>{
        submitBtn.disabled=false;
        if(r.success){
          if(u)u.password_set=true;
          doLogin(u);
        } else if(r.needs_setup){
          // First-time user — switch to setup mode
          _pinMode='setup';
          document.getElementById("lf-pw-label").textContent="Create your password";
          document.getElementById("lf-password").placeholder="Choose a password (min 6 chars)";
          document.getElementById("lf-password").value="";
          document.getElementById("lf-pw-confirm-group").style.display="";
          document.getElementById("lf-forgot").style.display="none";
          errEl.textContent="No password set yet — please create one.";
          setTimeout(()=>document.getElementById("lf-password").focus(),100);
        } else {
          errEl.textContent="Incorrect password.";
          document.getElementById("lf-password").value="";
          setTimeout(()=>document.getElementById("lf-password").focus(),100);
        }
      }).catch(()=>{submitBtn.disabled=false;errEl.textContent="Network error — try again.";});
    }
  }
}

function pinNext(idx){
  const el=document.getElementById("pin"+idx);
  if(!el)return;
  el.value=el.value.replace(/\D/g,"").slice(-1);
  if(el.value&&idx<3) document.getElementById("pin"+(idx+1)).focus();
  if(el.value&&idx>=4&&idx<7) document.getElementById("pin"+(idx+1)).focus();
  const maxIdx=(_pinMode==='setup')?7:3;
  if(idx===maxIdx&&el.value) lfSubmit();
}

function pinKeydown(event,idx){
  if(event.key==="Backspace"&&!document.getElementById("pin"+idx).value){
    // Don't jump from first confirm digit (4) back into main pin (3)
    if(idx>0&&idx!==4) document.getElementById("pin"+(idx-1)).focus();
  }
}

(function initPage(){
  // First check for reset token in URL
  const params=new URLSearchParams(window.location.search);
  const tok=params.get("reset_token"),uid=params.get("uid");
  if(tok&&uid){
    _resetToken=tok;_resetUid=uid;
    // Detect employee vs non-employee after EMPS load below to show correct reset form
  }

  // Build the form immediately so it's ready before any async fetch returns.
  // EMPS is empty at this point so the dropdown shows only the placeholder;
  // after load() returns we repopulate the <select> without touching the rest
  // of the form, so any selection the user has already made is preserved.
  buildLoginForm();

  // Load clients for company dropdown (background, non-blocking)
  fetch(API_BASE+"?action=load_clients").then(r=>r.json()).then(d=>{
    if(d.success&&d.clients) CLIENTS=d.clients;
  }).catch(()=>{});

  // No-op: autocomplete input no longer needs a rebuild when EMPS loads.
  // EMPS array is queried live on each keystroke, so there's nothing to refresh.
  function refreshNameDropdown(){ /* intentionally empty */ }

  // Load employees from DB (load is a GET action)
  fetch(API_BASE+"?action=load").then(r=>r.json()).then(data=>{
    // Pull settings
    const s=data.settings||data.data?.settings||{};
    if(s.ghl_webhook_url) GHL_WEBHOOK=s.ghl_webhook_url;

        ...e,

        pin_set:!!e.pin_set
      }));
    }
    // Only refresh the dropdown options — never rebuild the whole form.

    refreshNameDropdown();

    if(tok&&uid){
      document.getElementById("login-card-select").style.display="none";

      document.getElementById("login-card-reset").style.display="";

          <input type="text" placeholder="Company" value="${en.co}" list="${(!isViewing&&CLIENTS.length)?'cl-clients':''}" onchange="upE(${dayIdx},${ei},'co',this.value)"${ro}>
          <input type="text" placeholder="Deliverable" value="${en.del}" onchange="upE(${dayIdx},${ei},'del',this.value)"${ro}>

          <input type="number" placeholder="0" value="${en.hrs}" min="0" max="24" step="0.5" onchange="upE(${dayIdx},${ei},'hrs',this.value)"${ro}>

// ── DATA HELPERS ──────────────────────────────────────────────────────────
function calcBreakdown(d){
  const result={};
  BILLING_TYPES.forEach(bt=>{ result[bt.key]={h:0}; });
  d.entries.forEach(en=>{
    const bt=en.bt||BT_DEFAULT;
    if(!result[bt]) result[bt]={h:0};
    result[bt].h+=pfl(en.hrs);
  });
  return result;
}

function upRate(v){gd(cur._vid||cur.id,pidx).rate=v;recalc(cur._vid||cur.id);}
function upE(day,ei,field,val){
  const d=gd(cur._vid||cur.id,pidx);
  const en=d.entries.find(e=>e.day===day&&e.ei===ei);
  if(en)en[field]=val;recalc(cur._vid||cur.id);
}
function upBT(day,ei,val){
  const d=gd(cur._vid||cur.id,pidx);
  const en=d.entries.find(e=>e.day===day&&e.ei===ei);
  if(en){en.bt=val;}recalc(cur._vid||cur.id);
}

function recalc(uid){
  const d=gd(uid||cur.id,pidx),rt=pfl(d.rate);
  for(let wk=0;wk<2;wk++){
    let wH=0,wP=0;
    d.entries.forEach(e=>{if(e.day>=wk*7&&e.day<=wk*7+6){wH+=pfl(e.hrs);wP+=pfl(e.hrs)*rt;}});
    const he=document.getElementById("wh"+wk),pe=document.getElementById("wp"+wk);
    if(he)he.textContent=wH.toFixed(1);if(pe)pe.textContent=fm(wP);
  }
  const allH=d.entries.reduce((s,e)=>s+pfl(e.hrs),0),allP=allH*rt;
  const ge=document.getElementById("gh"),gpe=document.getElementById("gp");
  if(ge)ge.textContent=allH.toFixed(1)+" hrs";if(gpe)gpe.textContent=fm(allP);

  // Update billing breakdown cards
  const breakdown=calcBreakdown(d);
  BILLING_TYPES.forEach(bt=>{
    const hEl=document.getElementById("bb-"+bt.key+"-h");
    const pEl=document.getElementById("bb-"+bt.key+"-p");
    if(hEl)hEl.textContent=breakdown[bt.key].h.toFixed(1)+" hrs";
    if(pEl)pEl.textContent=rt?fm(breakdown[bt.key].h*rt):"";
  });

  // Update pay cells
  d.entries.forEach((en,i)=>{
    const rows=document.querySelectorAll(".entry-row");if(!rows[i])return;
    const cells=rows[i].querySelectorAll(".dpay");const h=pfl(en.hrs);
    if(cells[0])cells[0].textContent=rt?fm(rt):"-";
    if(cells[1])cells[1].textContent=(h&&rt)?fm(h*rt):"-";
  });
}

// ── SUBMIT ────────────────────────────────────────────────────────────────
function doSubmit(){
  const d=gd(cur.id,pidx);d.submitted=true;
  const allH=d.entries.reduce((s,e)=>s+pfl(e.hrs),0);
  const breakdown=calcBreakdown(d);
  // totalPay intentionally excluded from GHL payload for confidentiality
  const payload={
    employee:cur.name,
    period:PERIODS[pidx],
    totalHours:allH.toFixed(1),
    billableHours:breakdown.billable.h.toFixed(1),
    nonBillableHours:breakdown.nonbillable.h.toFixed(1),
    marketingHours:breakdown.marketing.h.toFixed(1),
    submittedAt:new Date().toISOString(),
    entries:d.entries.filter(e=>e.hrs||e.co).map(e=>({...e,billingType:e.bt||BT_DEFAULT}))
  };
  if(GHL_WEBHOOK){
    fetch(GHL_WEBHOOK,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
      .then(()=>showToast("Submitted! GHL workflow triggered. Manager will be notified."))
      .catch(()=>showToast("Submitted locally. Check GHL webhook URL in Settings."));
  } else {
    showToast("Submitted! Add your GHL webhook URL in the GHL Setup tab to auto-notify manager.");
  }
  renderApp();
}

// ── EXPORT ────────────────────────────────────────────────────────────────
function doExport(){
  const d=gd(cur.id,pidx),rt=pfl(d.rate);
  let csv="Employee,Period,Day,Date,Company,Deliverable,BillingType,Hours,PayRate,DailyPay\n";
  d.entries.forEach(en=>{
    if(!en.hrs&&!en.co)return;
    const dt=pdate(pidx,en.day),h=pfl(en.hrs);
    csv+=`${cur.name},"${PERIODS[pidx]}",${DAYS[en.day]},${dt.toLocaleDateString("en-US",{month:"short",day:"numeric"})},"${en.co}","${en.del}",${btLabel(en.bt||BT_DEFAULT)},${h},${rt},${fm(h*rt)}\n`;
  });
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download=`${cur.name.replace(/ /g,"_")}_${PERIODS[pidx].replace(/ /g,"_")}.csv`;a.click();
  showToast("CSV exported successfully.");
}

function switchTab(tab){
  const allTabs=["dash","records","team","hrm","auditlog","reports","clients","projects","ghl","instructions","settings"];
  allTabs.forEach(t=>{
    const pane=document.getElementById("pane-"+t);
    const btn=document.getElementById("tab-"+t);
    if(pane)pane.style.display=t===tab?"block":"none";
    if(btn)btn.className="tab"+(t===tab?" active":"");
  });
  if(tab==="reports"){loadClientReport();const lbl=document.getElementById("cr-period-label");if(lbl)lbl.textContent=PERIODS[pidx]+" · Confidential";}
  if(tab==="records") renderRecords();
  if(tab==="team"){renderTeam();populatePeriodSelects();}
  if(tab==="hrm"){populatePeriodSelects();renderHRM();}
  if(tab==="auditlog"){populatePeriodSelects();renderAuditLog();}
  if(tab==="clients") renderClients();
  if(tab==="projects") renderProjects();
  if(tab==="settings") renderSettings();
}

function renderRecords(){
  const wrap=document.getElementById("records-table-wrap");
  if(!wrap) return;
  const showPayroll=(cur.role==="hr"||cur.role==="admin");
  const empFilter=document.getElementById("rec-emp-filter")?document.getElementById("rec-emp-filter").value:"";
  const statusFilter=document.getElementById("rec-status-filter")?document.getElementById("rec-status-filter").value:"";
  const emps=EMPS.filter(e=>e.role==="employee"&&(!empFilter||e.id==empFilter));
  let rows="";
  PERIODS.forEach((period,pi)=>{
    emps.forEach(emp=>{
      const d=gd(emp.id,pi);
      const h=d.entries.reduce((s,e)=>s+pfl(e.hrs),0);
      if(h===0&&!d.submitted) return;
      const status=d.submitted?"submitted":"pending";
      if(statusFilter&&statusFilter==="submitted"&&!d.submitted) return;
      if(statusFilter&&statusFilter==="pending"&&d.submitted) return;
      const rt=pfl(d.rate),pay=h*rt;
      const bd=calcBreakdown(d);
      const st=d.submitted?'<span class="badge b-sub">Submitted</span>':h>0?'<span class="badge b-prog">In Progress</span>':'<span class="badge b-pend">Pending</span>';
      rows+=`<tr>
        <td><strong>${emp.name}</strong></td>
        <td style="font-size:.78rem;color:var(--mid)">${period}</td>
        <td>${h.toFixed(1)}</td>
        <td style="color:#166534">${bd.billable.h.toFixed(1)}</td>
        <td style="color:#854d0e">${bd.nonbillable.h.toFixed(1)}</td>
        <td style="color:#3730a3">${bd.marketing.h.toFixed(1)}</td>
        ${showPayroll?`<td style="color:var(--teal);font-weight:600">${pay?fm(pay):"-"}</td>`:""}
        <td>${st}</td>
        <td><button class="btn btn-outline" style="padding:.2rem .55rem;font-size:.72rem" onclick="viewEmp('${emp.id}')">View</button></td>
      </tr>`;
    });
  });
  if(!rows){wrap.innerHTML='<div style="padding:2rem;text-align:center;color:var(--mid)">No records found.</div>';return;}
  wrap.innerHTML=`<div class="billing-tbl"><table>
    <thead><tr>
      <th>Employee</th><th>Period</th><th>Total Hrs</th>
      <th style="color:#86efac">Billable</th><th style="color:#fde047">Non-Bill.</th><th style="color:#a5b4fc">Marketing</th>
      ${showPayroll?`<th>Total Pay</th>`:""}
      <th>Status</th><th>Action</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderTeam(){
  const wrap=document.getElementById("team-table-wrap");
  if(!wrap) return;
  const allStaff=EMPS.filter(e=>e.role!=="admin");
  if(!allStaff.length){wrap.innerHTML='<div style="padding:2rem;text-align:center;color:var(--mid)">No team members yet.</div>';return;}
  const rows=allStaff.map(e=>{
    const roleBadge=e.role==="manager"?'<span class="badge-role mgr">Manager</span>':e.role==="hr"?'<span class="badge-role hr">HR</span>':'<span class="badge-role">Employee</span>';
    const isActive=e.active!==false&&e.status!=="inactive";
    const statusDot=isActive?'<span style="color:#10b981;font-size:.78rem">● Active</span>':'<span style="color:#ef4444;font-size:.78rem">● Inactive</span>';
    const credential=e.role==="employee"?(e.pin_set?'<span style="color:#10b981;font-size:.75rem">PIN set</span>':'<span style="color:#f59e0b;font-size:.75rem">No PIN</span>'):(e.password_set?'<span style="color:#10b981;font-size:.75rem">PW set</span>':'<span style="color:#f59e0b;font-size:.75rem">No PW</span>');
    return `<tr>
      <td><strong>${e.name}</strong></td>
      <td style="font-size:.78rem;color:var(--mid)">${e.email||"—"}</td>
      <td>${roleBadge}</td>
      <td>${statusDot}</td>
      <td>${credential}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-outline" style="padding:.2rem .55rem;font-size:.72rem;margin-right:.35rem" onclick="editMember('${e.id}')">Edit</button>
        <button class="btn btn-outline" style="padding:.2rem .55rem;font-size:.72rem;color:${isActive?'#ef4444':'#10b981'}" onclick="toggleMemberActive('${e.id}',${isActive})">${isActive?"Deactivate":"Reactivate"}</button>
      </td>
    </tr>`;
  }).join("");
  wrap.innerHTML=`<div class="billing-tbl"><table>
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Credential</th><th>Actions</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

let _rptTab='master';

let _rptStart='', _rptEnd='';

function switchRptTab(tab){
  _rptTab=tab;

  document.querySelectorAll('.rpt-tab').forEach((b,i)=>{

async function loadClientReport(){
  const el=document.getElementById("cr-content");
  if(!el) return;

  // Build range selector UI on first load
  const lbl=document.getElementById("cr-period-label");
  if(lbl) lbl.textContent='';

  // Inject range controls above content if not already there
  let rangeBar=document.getElementById('rpt-range-bar');
  if(!rangeBar){
    // Fetch real periods from DB first
    let dbPeriods=[];
    try{
      const pr=await fetch(`${API_BASE}?action=load_periods`).then(x=>x.json());
      dbPeriods=pr.periods||[];
    }catch(e){}
    // Merge: DB periods first, then PERIODS array for any not yet in DB
    const merged=[...dbPeriods];
    PERIODS.forEach(p=>{ if(!merged.includes(p)) merged.push(p); });
    const periodOpts=merged.map((p,i)=>`<option value="${p}"${i===0?' selected':''}>${p}</option>`).join('');

    rangeBar=document.createElement('div');
    rangeBar.id='rpt-range-bar';
    rangeBar.style.cssText='display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem;padding:.75rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:10px';
    rangeBar.innerHTML=`
      <span style="font-size:.78rem;font-weight:600;color:var(--mid);text-transform:uppercase;letter-spacing:.04em">Range</span>
      <select id="rpt-range-mode" style="background:var(--hover);border:1px solid var(--border);border-radius:7px;padding:.35rem .7rem;font-size:.82rem;color:var(--dark)" onchange="onRptRangeMode()">
        <option value="period">Pay Period</option>
        <option value="custom">Custom Dates</option>
      </select>
      <div id="rpt-period-sel" style="display:flex;gap:.4rem;align-items:center">
        <select id="rpt-period-pick" style="background:var(--hover);border:1px solid var(--border);border-radius:7px;padding:.35rem .7rem;font-size:.82rem;color:var(--dark)" onchange="loadClientReport()">
          ${periodOpts}
        </select>
      </div>
      <div id="rpt-custom-sel" style="display:none;gap:.4rem;align-items:center;flex-wrap:wrap">
        <input type="date" id="rpt-date-start" style="background:var(--hover);border:1px solid var(--border);border-radius:7px;padding:.35rem .6rem;font-size:.82rem;color:var(--dark)">
        <span style="color:var(--mid);font-size:.8rem">to</span>
        <input type="date" id="rpt-date-end" style="background:var(--hover);border:1px solid var(--border);border-radius:7px;padding:.35rem .6rem;font-size:.82rem;color:var(--dark)">
        <button class="btn btn-primary" style="padding:.35rem .85rem;font-size:.78rem" onclick="loadClientReport()">Run</button>
      </div>`;
    el.parentNode.insertBefore(rangeBar, el);
  }

  // Determine range label
  const mode=document.getElementById('rpt-range-mode')?.value||'period';
  let rangeLabel='';
  if(mode==='custom'){
    const s=document.getElementById('rpt-date-start')?.value;
    const e=document.getElementById('rpt-date-end')?.value;
    if(!s||!e){el.innerHTML='<div style="color:var(--mid);padding:1.5rem;text-align:center">Pick a start and end date, then click Run.</div>';return;}
    _rptStart=s; _rptEnd=e;
    rangeLabel=`${s} → ${e}`;
  } else {
    const sel=document.getElementById('rpt-period-pick');
    rangeLabel=sel?sel.value:PERIODS[pidx];
    _rptStart=''; _rptEnd='';
  }
  if(lbl) lbl.textContent=rangeLabel+' · Confidential';

  el.innerHTML='<div style="color:var(--mid);padding:2rem;text-align:center"><span class="spinner" style="display:inline-block;width:20px;height:20px;border:2px solid #e2e8f0;border-top-color:#03AD8F;border-radius:50%;animation:spin .75s linear infinite"></span></div>';
  try{
    let url=`${API_BASE}?action=load_report_v2`;
    if(mode==='custom') url+=`&date_start=${encodeURIComponent(_rptStart)}&date_end=${encodeURIComponent(_rptEnd)}`;
    else url+=`&period=${encodeURIComponent(rangeLabel)}`;
    const r=await fetch(url);
    const data=await r.json();
    if(!data.success){el.innerHTML='<div style="color:red;padding:1rem">Failed to load report.</div>';return;}
    _rptData=data.report;
    renderRptTab(_rptData);
  }catch(e){
    el.innerHTML='<div style="color:red;padding:1rem">Error: '+e.message+'</div>';
  }
}

function onRptRangeMode(){
  const mode=document.getElementById('rpt-range-mode')?.value;
  const ps=document.getElementById('rpt-period-sel');
  const cs=document.getElementById('rpt-custom-sel');
  if(ps) ps.style.display=mode==='period'?'flex':'none';
  if(cs) cs.style.display=mode==='custom'?'flex':'none';
}

function renderRptTab(d){
  const el=document.getElementById("cr-content");
  if(!el) return;
  if(_rptTab==='master')      el.innerHTML=renderMasterTab(d);
  else if(_rptTab==='billable')    el.innerHTML=renderBillableTab(d);
  else if(_rptTab==='nonbillable') el.innerHTML=renderNBTab(d);
  else if(_rptTab==='marketing')   el.innerHTML=renderMKTab(d);
  else if(_rptTab==='projections') el.innerHTML=renderProjectionsTab(d);
}

function fmt(n){return parseFloat(n||0).toFixed(1);}
function fmtMoney(n){return '$'+parseFloat(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function rptTblWrap(html){return`<div class="billing-tbl">${html}</div>`;}
function metricCards(cards){
  return`<div class="metrics" style="margin-bottom:1rem">${cards.map(c=>`
    <div class="mc" style="border-left:3px solid ${c.color||'var(--navy)'}">
      <div class="ml">${c.label}</div>
      <div class="mv" style="color:${c.color||'var(--navy)'}">${c.val}</div>
      <div class="ms">${c.sub||''}</div>
    </div>`).join('')}</div>`;
}

function renderMasterTab(d){
  const rows=d.master||[];
  const counts=d.counts||{};
  let tH=0,tB=0,tNB=0,tMK=0,tPay=0;
  const trs=rows.map(r=>{
    const h=parseFloat(r.total_hours||0),b=parseFloat(r.billable_hours||0),
          nb=parseFloat(r.nonbillable_hours||0),mk=parseFloat(r.marketing_hours||0),
          pay=parseFloat(r.total_pay||0);
    tH+=h;tB+=b;tNB+=nb;tMK+=mk;tPay+=pay;
    const bPct=h?Math.round(b/h*100):0;
    return`<tr>
      <td><strong>${escHtml(r.employee||'—')}</strong></td>
      <td style="font-family:'DM Mono',monospace">${fmt(h)}</td>
      <td style="color:#86efac;font-family:'DM Mono',monospace">${fmt(b)}</td>
      <td style="color:#fde047;font-family:'DM Mono',monospace">${fmt(nb)}</td>
      <td style="color:#a5b4fc;font-family:'DM Mono',monospace">${fmt(mk)}</td>
      <td>
        <div style="display:flex;align-items:center;gap:.4rem">
          <div class="proj-bar-wrap" style="width:60px"><div class="proj-bar" style="width:${bPct}%;background:#03AD8F"></div></div>
          <span style="font-size:.72rem;color:rgba(255,255,255,.55)">${bPct}%</span>
        </div>
      </td>
      <td style="font-family:'DM Mono',monospace;color:#e2e8f0">${r.total_pay?fmtMoney(pay):'—'}</td>
      <td><span style="font-size:.68rem;padding:.15rem .5rem;border-radius:4px;background:${r.status==='approved'?'rgba(16,185,129,.2)':r.status==='submitted'?'rgba(234,179,8,.2)':'rgba(100,116,139,.15)'};color:${r.status==='approved'?'#4ade80':r.status==='submitted'?'#fde047':'#94a3b8'}">${r.status||'draft'}</span></td>
    </tr>`;
  }).join('');

  const totalEmp=parseInt(counts.total_employees||rows.length)||1;
  const submittedCount=parseInt(counts.submitted_count||0);
  const approvedCount=parseInt(counts.approved_count||0);

  // SVG bar chart — hours by employee
  const barData=rows.map(r=>({name:(r.employee||'?').split(' ')[0],h:parseFloat(r.total_hours||0),b:parseFloat(r.billable_hours||0)})).filter(r=>r.h>0);
  const maxH=Math.max(...barData.map(r=>r.h),1);
  const bW=Math.max(Math.floor(220/Math.max(barData.length,1))-6,12);
  const barSvg=barData.length?`<svg viewBox="0 0 ${Math.max(barData.length*(bW+6)+10,60)} 80" style="width:100%;height:80px">
    ${barData.map((r,i)=>{
      const bH=Math.round((r.h/maxH)*68);
      const bBH=Math.round((r.b/maxH)*68);
      const x=i*(bW+6)+5;
      return`<rect x="${x}" y="${80-bH-8}" width="${bW}" height="${bH}" fill="rgba(255,255,255,.18)" rx="3"/>
        <rect x="${x}" y="${80-bBH-8}" width="${bW}" height="${bBH}" fill="#03AD8F" rx="3"/>
        <text x="${x+bW/2}" y="78" text-anchor="middle" font-size="7" fill="rgba(255,255,255,.6)">${r.name}</text>`;
    }).join('')}
  </svg>`:'<div style="color:rgba(255,255,255,.4);font-size:.78rem;padding:.5rem 0">No data</div>';

  // SVG donut chart — billable hours by client
  const billRows=(d.billable||[]).filter(c=>parseFloat(c.hours)>0).slice(0,8);
  const donutColors=['#03AD8F','#6366f1','#f59e0b','#ec4899','#0ea5e9','#84cc16','#f87171','#a78bfa'];
  const donutTotal=billRows.reduce((s,c)=>s+parseFloat(c.hours||0),0)||1;
  let cumulAngle=0;
  const cx=56,cy=56,r2=42,r3=26;
  const donutPaths=billRows.map((c,i)=>{
    const pct=parseFloat(c.hours||0)/donutTotal;
    const a1=cumulAngle,a2=cumulAngle+pct*360-0.3;
    cumulAngle+=pct*360;
    const toRad=a=>a*Math.PI/180;
    const x1=cx+r2*Math.sin(toRad(a1)),y1=cy-r2*Math.cos(toRad(a1));
    const x2=cx+r2*Math.sin(toRad(a2)),y2=cy-r2*Math.cos(toRad(a2));
    const x3=cx+r3*Math.sin(toRad(a2)),y3=cy-r3*Math.cos(toRad(a2));
    const x4=cx+r3*Math.sin(toRad(a1)),y4=cy-r3*Math.cos(toRad(a1));
    const lg=pct>.5?1:0;
    return`<path d="M${x1},${y1} A${r2},${r2} 0 ${lg},1 ${x2},${y2} L${x3},${y3} A${r3},${r3} 0 ${lg},0 ${x4},${y4} Z" fill="${donutColors[i%donutColors.length]}" opacity=".92"/>`;

function renderBillableTab(d){
  const rows=d.billable||[];
  const byEmp=d.billableEmp||[];
  if(!rows.length) return'<div style="color:var(--mid);padding:2rem;text-align:center">No billable hours logged this period.</div>';
  let tH=0,tCost=0;
  const trs=rows.map(c=>{
    const h=parseFloat(c.hours||0),cost=parseFloat(c.cost||0);
    tH+=h;tCost+=cost;
    // employee sub-rows for this client
    const empSubs=byEmp.filter(e=>e.client===c.client);
    const empList=empSubs.map(e=>`<span style="font-size:.72rem;background:#f1f5f9;border-radius:4px;padding:.1rem .45rem;margin-right:.2rem">${escHtml(e.employee)} ${fmt(e.hours)}h</span>`).join('');
    return`<tr>
      <td><strong>${escHtml(c.client)}</strong><div style="margin-top:.25rem">${empList}</div></td>
      <td><span style="font-size:.68rem;color:var(--mid);text-transform:uppercase">${c.type||''}</span></td>
      <td style="font-family:'DM Mono',monospace;font-weight:600;color:#059669">${fmt(h)}</td>
      <td style="font-family:'DM Mono',monospace;color:#0369a1">${cost?fmtMoney(cost):'—'}</td>
    </tr>`;
  }).join('');
  return metricCards([
    {label:'Billable Hours',val:fmt(tH),sub:'Client-facing work',color:'#059669'},
    {label:'Team Cost',val:fmtMoney(tCost),sub:'At employee rates',color:'#0369a1'},
    {label:'Clients',val:rows.length,sub:'Active this period',color:'#1e293b'},
  ])+rptTblWrap(`<table>
    <thead><tr><th>Client</th><th>Type</th><th>Hours</th><th>Team Cost</th></tr></thead>
    <tbody>${trs}</tbody>
    <tfoot><tr><td colspan="2">TOTAL</td><td style="font-family:'DM Mono',monospace;color:#059669">${fmt(tH)}</td><td style="font-family:'DM Mono',monospace;color:#0369a1">${fmtMoney(tCost)}</td></tr></tfoot>
  </table>`);
}

function renderNBTab(d){
  const rows=d.nonbillable||[];
  const byEmp=d.nbEmp||[];
  if(!rows.length) return'<div style="color:var(--mid);padding:2rem;text-align:center">No non-billable hours logged this period.</div>';
  let tH=0;
  // Group by employee to show who is spending non-billable time
  const empMap={};
  byEmp.forEach(e=>{
    if(!empMap[e.employee]) empMap[e.employee]=0;
    empMap[e.employee]+=parseFloat(e.hours||0);
  });
  const empTrs=Object.entries(empMap).sort((a,b)=>b[1]-a[1]).map(([name,h])=>{
    tH+=h;
    const empClients=byEmp.filter(e=>e.employee===name).map(e=>`<span style="font-size:.72rem;background:#fef3c7;border-radius:4px;padding:.1rem .45rem;margin-right:.2rem">${escHtml(e.client)} ${fmt(e.hours)}h</span>`).join('');
    return`<tr>
      <td><strong>${escHtml(name)}</strong><div style="margin-top:.25rem">${empClients}</div></td>
      <td style="font-family:'DM Mono',monospace;font-weight:600;color:#d97706">${h.toFixed(1)}</td>
    </tr>`;
  }).join('');
  const clientTrs=rows.map(c=>`<tr>
    <td>${escHtml(c.client)}</td>
    <td style="font-size:.68rem;color:var(--mid)">${c.type||'internal'}</td>
    <td style="font-family:'DM Mono',monospace;color:#d97706">${fmt(c.hours)}</td>
    <td style="font-size:.72rem;color:var(--mid)">${escHtml(c.employees||'—')}</td>
  </tr>`).join('');
  return metricCards([
    {label:'Non-Bill. Hours',val:fmt(tH),sub:'Overhead & internal',color:'#d97706'},
  ])+
  `<div class="rpt-card"><h3>By Employee</h3>`+
  rptTblWrap(`<table><thead><tr><th>Employee</th><th>Hours</th></tr></thead><tbody>${empTrs}</tbody></table>`)+
  `</div><div class="rpt-card"><h3>By Client / Project</h3>`+
  rptTblWrap(`<table><thead><tr><th>Client</th><th>Type</th><th>Hours</th><th>Team</th></tr></thead><tbody>${clientTrs}</tbody></table>`)+
  `</div>`;
}

function renderProjectionsTab(d){
  const projs=d.projections||[];
  if(!projs.length) return'<div style="color:var(--mid);padding:2rem;text-align:center">No active projects found.</div>';
  let totalEst=0,totalLogged=0;
  projs.forEach(p=>{if(p.estimated_hours) totalEst+=parseFloat(p.estimated_hours||0); totalLogged+=parseFloat(p.logged_hours||0);});
  const rows=projs.map(p=>{
    const est=parseFloat(p.estimated_hours||0);
    const logged=parseFloat(p.logged_hours||0);
    const pct=est?Math.min(100,Math.round(logged/est*100)):0;
    const over=est&&logged>est;
    const barColor=over?'#ef4444':pct>75?'#f59e0b':'#059669';
    const doneCount=parseInt(p.done_count||0), taskCount=parseInt(p.task_count||0);
    const taskPct=taskCount?Math.round(doneCount/taskCount*100):0;
    const due=p.due_date?new Date(p.due_date):null;
    const today=new Date(); today.setHours(0,0,0,0);
    const overdue=due&&due<today&&p.status!=='completed';
    const dueFmt=due?due.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
    return`<tr>
      <td>
        <strong>${escHtml(p.name)}</strong>
        ${p.client_name?`<div style="font-size:.72rem;color:var(--mid)">${escHtml(p.client_name)}</div>`:''}
      </td>
      <td><span class="btype-tag bt-${p.billing_type||'billable'}">${(BILLING_TYPES.find(b=>b.key===p.billing_type)||{label:'Billable'}).label}</span></td>
      <td>
        <input type="number" min="0" step=".5" value="${est||''}" placeholder="—"
          style="width:70px;background:var(--hover);border:1px solid var(--border);border-radius:6px;padding:.25rem .5rem;font-size:.8rem;color:var(--dark);text-align:center"
          onchange="setProjectEstHours(${p.id},this.value)" title="Set estimated hours">
      </td>
      <td style="font-family:'DM Mono',monospace;color:${over?'#ef4444':'var(--dark)'};font-weight:${over?'700':'400'}">${fmt(logged)}</td>
      <td>
        ${est?`<div style="display:flex;align-items:center;gap:.4rem">
          <div class="proj-bar-wrap" style="width:80px"><div class="proj-bar" style="width:${pct}%;background:${barColor}"></div></div>
          <span style="font-size:.72rem;color:${barColor};font-weight:600">${pct}%${over?' ⚠️':''}</span>
        </div>`:'<span style="font-size:.72rem;color:var(--mid)">Set est. →</span>'}
      </td>
      <td>
        <div style="font-size:.78rem">${doneCount}/${taskCount} tasks</div>
        <div class="proj-bar-wrap" style="width:60px;margin-top:.2rem"><div class="proj-bar" style="width:${taskPct}%;background:#8b5cf6"></div></div>
      </td>
      <td style="font-size:.78rem;color:${overdue?'#ef4444':'var(--mid)'}">${dueFmt}${overdue?' ⚠️':''}</td>
      <td><span style="font-size:.68rem;padding:.15rem .5rem;border-radius:4px;background:${p.status==='completed'?'#dcfce7':p.status==='on_hold'?'#fef3c7':'#dbeafe'};color:${p.status==='completed'?'#166534':p.status==='on_hold'?'#92400e':'#1e40af'}">${p.status||'active'}</span></td>
    </tr>`;
  }).join('');
  return metricCards([
    {label:'Active Projects',val:projs.length,sub:'Across all clients',color:'#1e293b'},
    {label:'Est. Hours',val:fmt(totalEst),sub:'Total projected workload',color:'#8b5cf6'},
    {label:'Logged Hours',val:fmt(totalLogged),sub:'Matched to projects',color:'#059669'},
    {label:'Remaining',val:fmt(Math.max(0,totalEst-totalLogged)),sub:'Of estimated',color:'#d97706'},
  ])+
  `<p style="font-size:.78rem;color:var(--mid);margin:.5rem 0 .75rem">💡 Click the <strong>Est. Hours</strong> field on any project to set your time budget. Turns orange when 75% used, red when over.</p>`+
  rptTblWrap(`<table>
    <thead><tr><th>Project</th><th>Type</th><th>Est. Hrs</th><th>Logged Hrs</th><th>Progress</th><th>Tasks</th><th>Due</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`);
}

async function setProjectEstHours(projId, val){
  const hrs=parseFloat(val)||null;
  await api({action:'set_project_est_hours',project_id:projId,estimated_hours:hrs});
  showToast('Estimated hours saved.');
}

async function exportReportCSV(){
  if(!_rptData){showToast('Load a report first.');return;}
  const d=_rptData;
  const lbl=document.getElementById('cr-period-label')?.textContent||'report';
  let csvParts=[];
  // Master
  csvParts.push('MASTER SUMMARY');
  csvParts.push('Employee,Total Hours,Billable,Non-Billable,Marketing,Total Pay,Status');
  (d.master||[]).forEach(r=>{
    csvParts.push(`"${r.employee}",${fmt(r.total_hours)},${fmt(r.billable_hours)},${fmt(r.nonbillable_hours)},${fmt(r.marketing_hours)},${r.total_pay?fmt(r.total_pay):''},${r.status||'draft'}`);
  });
  csvParts.push('');
  // Billable
  csvParts.push('BILLABLE HOURS BY CLIENT');
  csvParts.push('Client,Type,Hours,Team Cost');
  (d.billable||[]).forEach(c=>{
    csvParts.push(`"${c.client}","${c.type||''}",${fmt(c.hours)},${c.cost?fmt(c.cost):''}`);
  });
  csvParts.push('');
  // Non-billable
  csvParts.push('NON-BILLABLE HOURS BY CLIENT');
  csvParts.push('Client,Type,Hours,Team');
  (d.nonbillable||[]).forEach(c=>{
    csvParts.push(`"${c.client}","${c.type||''}",${fmt(c.hours)},"${c.employees||''}"`);
  });
  csvParts.push('');
  // Marketing
  csvParts.push('MARKETING HOURS BY CLIENT');
  csvParts.push('Client,Type,Hours,Team');
  (d.marketing||[]).forEach(c=>{
    csvParts.push(`"${c.client}","${c.type||''}",${fmt(c.hours)},"${c.employees||''}"`);
  });
  csvParts.push('');
  // Projections
  csvParts.push('PROJECTS & PROJECTIONS');
  csvParts.push('Project,Client,Type,Est. Hours,Logged Hours,% Used,Tasks Done/Total,Due Date,Status');
  (d.projections||[]).forEach(p=>{
    const est=parseFloat(p.estimated_hours||0);
    const logged=parseFloat(p.logged_hours||0);
    const pct=est?Math.round(logged/est*100):0;
    csvParts.push(`"${p.name}","${p.client_name||''}","${p.billing_type||''}",${est||''},${fmt(logged)},${est?pct+'%':''},"${p.done_count||0}/${p.task_count||0}","${p.due_date||''}","${p.status||''}"`);
  });
  const csv=csvParts.join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`genhead_report_${lbl.replace(/[^a-z0-9]/gi,'_').toLowerCase()}.csv`;
  a.click();
}

    const d=gd(emp.id,pidx),h=d.entries.reduce((s,e)=>s+pfl(e.hrs),0),rt=pfl(d.rate);

  });

  a.download=`Genhead_Master_Payroll_${PERIODS[pidx].replace(/ /g,"_")}.csv`;a.click();

}

async function renderHRM(){
  const wrap=document.getElementById("hrm-content");
  if(!wrap) return;
  wrap.innerHTML='<div style="padding:2rem;text-align:center;color:var(--mid)">Loading…</div>';
  try{
    const r=await fetch(`${API_BASE}?action=load_timesheets`);
    const data=await r.json();
    if(!data.success){wrap.innerHTML='<div style="padding:2rem;color:#ef4444">Failed to load timecards.</div>';return;}
    let records=data.records||[];
    const statusFilter=document.getElementById("hrm-status-filter")?document.getElementById("hrm-status-filter").value:"submitted";
    const periodFilter=document.getElementById("hrm-period-filter")?document.getElementById("hrm-period-filter").value:"";
    if(statusFilter) records=records.filter(r=>r.status===statusFilter);
    if(periodFilter) records=records.filter(r=>r.period===periodFilter);
    if(!records.length){
      wrap.innerHTML='<div style="padding:2.5rem;text-align:center;color:var(--mid)">No timecards match the selected filters.</div>';
      return;
    }
    const rows=records.map(r=>{
      const statusColor={submitted:"#f59e0b",approved:"#10b981",rejected:"#ef4444",returned:"#6366f1",draft:"#94a3b8"}[r.status]||"#94a3b8";
      const statusLabel={submitted:"Needs Review",approved:"Approved",rejected:"Rejected",returned:"Returned",draft:"Draft"}[r.status]||r.status;
      const subAt=r.submitted_at?new Date(r.submitted_at).toLocaleDateString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
      const apBy=r.approved_by_name||"—";
      return `<tr>
        <td><strong>${r.employee||"—"}</strong></td>
        <td style="font-size:.78rem;color:var(--mid)">${r.period||"—"}</td>
        <td style="font-family:'DM Mono',monospace">${parseFloat(r.total_hours||0).toFixed(1)}</td>
        <td><span style="background:${statusColor}22;color:${statusColor};padding:.2rem .55rem;border-radius:5px;font-size:.75rem;font-weight:600">${statusLabel}</span></td>
        <td style="font-size:.76rem;color:var(--mid)">${subAt}</td>
        <td style="font-size:.76rem;color:var(--mid)">${apBy}</td>
        <td style="white-space:nowrap">
          ${r.status==="submitted"?`
            <button class="btn btn-outline" style="padding:.2rem .55rem;font-size:.72rem;color:#10b981;margin-right:.3rem" onclick="hrmAction('approve',${r.id},'${(r.employee||'').replace(/'/g,"\\'")}','${r.period||''}',${parseFloat(r.total_hours||0).toFixed(1)})">Approve</button>
            <button class="btn btn-outline" style="padding:.2rem .55rem;font-size:.72rem;color:#ef4444" onclick="hrmAction('reject',${r.id},'${(r.employee||'').replace(/'/g,"\\'")}','${r.period||''}',${parseFloat(r.total_hours||0).toFixed(1)})">Reject</button>
          `:`<span style="font-size:.76rem;color:var(--mid)">—</span>`}
        </td>

    }).join("");

      <thead><tr>
        <th>Employee</th><th>Period</th><th>Hours</th><th>Status</th>
        <th>Submitted</th><th>Reviewed By</th><th>Actions</th>

function hrmAction(action,tsId,employee,period,hours){
  _hrmAction=action;_hrmTsId=tsId;
  const modal=document.getElementById("hrm-modal");
  const title=document.getElementById("hrm-modal-title");
  const info=document.getElementById("hrm-modal-info");
  const reqLabel=document.getElementById("hrm-comment-required");
  const btn=document.getElementById("hrm-modal-confirm");
  document.getElementById("hrm-modal-comment").value="";
  title.textContent=action==="approve"?"Approve Timecard":"Reject Timecard";
  info.textContent=`${employee} · ${period} · ${hours} hrs`;
  reqLabel.style.display=action==="reject"?"inline":"none";
  btn.textContent=action==="approve"?"Approve":"Reject";
  btn.style.background=action==="approve"?"#10b981":"#ef4444";
  btn.onclick=()=>confirmHRMAction();
  modal.style.display="flex";
}

async function confirmHRMAction(){
  const comment=document.getElementById("hrm-modal-comment").value.trim();
  if(_hrmAction==="reject"&&!comment){alert("Please enter a reason for rejection.");return;}
  const approverId=cur.id?parseInt(cur.id.replace(/^e/,''),10):null;
  const approverName=cur.name||"HR";
  const payload={timesheet_id:_hrmTsId,approver_id:approverId,approver_name:approverName,comment};
  try{
    const r=await api({action:_hrmAction==="approve"?"approve_timesheet":"reject_timesheet",...payload});
    if(r.success){
      closeHRMModal();
      showToast(_hrmAction==="approve"?"Timecard approved!":"Timecard rejected.");
      renderHRM();
    } else {
      alert(r.error||"Action failed.");
    }
  }catch(e){alert("Error: "+e.message);}
}

  const m=document.getElementById("hrm-modal");
  if(m) m.style.display="none";
}
