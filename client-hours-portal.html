
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-Frame-Options" content="ALLOWALL">
<meta http-equiv="Content-Security-Policy" content="frame-ancestors *">
<title>Support Hours — Powered by Genhead</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#08153A;
  --teal:#03AD8F;
  --purple:#351D72;
  --gold:#f59e0b;
  --red:#ef4444;
  --green:#10b981;
  --border:#e2e8f0;
  --alt:#f8fafc;
  --bg:#ffffff;
  --dark:#1a1a2e;
  --mid:#64748b;
  --light:#94a3b8;
}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--alt);
  color:var(--dark);
  min-height:100vh;
}

/* ── HEADER ── */
.header{
  background:var(--navy);
  padding:.85rem 1.5rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand{font-size:1.05rem;font-weight:700;color:#fff;letter-spacing:-.5px}
.brand span{color:var(--teal)}
.plan-pill{
  font-size:.68rem;font-weight:700;
  padding:.22rem .75rem;border-radius:20px;
  text-transform:uppercase;letter-spacing:.5px;
}
.pill-retainer{background:rgba(3,173,143,.2);color:var(--teal);border:1px solid rgba(3,173,143,.4)}
.pill-diy{background:rgba(245,158,11,.15);color:var(--gold);border:1px solid rgba(245,158,11,.35)}
.pill-none{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.15)}

/* ── LAYOUT ── */
.page{max-width:860px;margin:0 auto;padding:1.5rem 1.25rem}

/* ── BALANCE HERO ── */
.balance-hero{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:14px;
  padding:1.5rem;
  margin-bottom:1rem;
  display:flex;
  align-items:center;
  gap:2rem;
}
.balance-left{flex:1}
.balance-eyebrow{
  font-size:.65rem;text-transform:uppercase;
  letter-spacing:.6px;color:var(--light);
  margin-bottom:.4rem;
}
.balance-number{
  font-size:3.2rem;font-weight:700;
  line-height:1;margin-bottom:.4rem;
  font-family:'DM Mono',monospace;
}
.balance-number.green{color:var(--teal)}
.balance-number.yellow{color:var(--gold)}
.balance-number.red{color:var(--red)}
.balance-sub{font-size:.82rem;color:var(--mid)}
.balance-sub strong{color:var(--dark)}

.stat-row{
  display:flex;gap:1rem;
  flex-shrink:0;
}
.stat-box{
  background:var(--alt);
  border:1px solid var(--border);
  border-radius:10px;
  padding:.75rem 1rem;
  text-align:center;
  min-width:90px;
}
.stat-val{
  font-size:1.3rem;font-weight:700;
  color:var(--dark);
  font-family:'DM Mono',monospace;
}
.stat-lbl{
  font-size:.62rem;text-transform:uppercase;
  letter-spacing:.4px;color:var(--light);
  margin-top:.2rem;
}

/* ── PROGRESS ── */
.progress-wrap{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:1rem 1.25rem;
  margin-bottom:1rem;
}
.progress-meta{
  display:flex;justify-content:space-between;
  font-size:.75rem;color:var(--mid);
  margin-bottom:.55rem;
}
.progress-track{
  height:10px;background:var(--border);
  border-radius:5px;overflow:hidden;
}
.progress-fill{
  height:100%;border-radius:5px;
  transition:width .7s cubic-bezier(.4,0,.2,1);
}
.fill-green{background:linear-gradient(90deg,#03AD8F,#00cec9)}
.fill-yellow{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.fill-red{background:linear-gradient(90deg,#ef4444,#f87171)}

/* ── PERIOD SELECTOR ── */
.period-row{
  display:flex;align-items:center;
  justify-content:space-between;
  margin-bottom:.75rem;
}
.section-title{
  font-size:.7rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;
  color:var(--mid);
}
.period-sel{
  padding:.28rem .6rem;
  border:1px solid var(--border);
  border-radius:6px;font-size:.78rem;
  font-family:'DM Sans',sans-serif;
  background:var(--bg);color:var(--dark);
  cursor:pointer;
}
.period-sel:focus{outline:none;border-color:var(--teal)}

/* ── ACTIVITY TABLE ── */
.activity-card{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  margin-bottom:1rem;
}
.activity-head{
  background:var(--navy);
  display:grid;
  grid-template-columns:1fr 2fr 1.5fr auto;
  gap:.5rem;
  padding:.55rem 1rem;
}
.activity-head span{
  font-size:.62rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.4px;
  color:rgba(255,255,255,.55);
}
.activity-head span:last-child{text-align:right}
.activity-row{
  display:grid;
  grid-template-columns:1fr 2fr 1.5fr auto;
  gap:.5rem;
  padding:.7rem 1rem;
  border-bottom:1px solid var(--border);
  align-items:center;
  transition:background .12s;
}
.activity-row:last-child{border-bottom:none}
.activity-row:hover{background:var(--alt)}
.act-date{font-size:.75rem;color:var(--mid)}
.act-task{font-size:.82rem;color:var(--dark)}
.act-member{font-size:.75rem;color:var(--mid)}
.act-hrs{
  font-size:.82rem;font-weight:700;
  color:var(--red);text-align:right;
  font-family:'DM Mono',monospace;
  white-space:nowrap;
}
.no-activity{
  padding:2.5rem;text-align:center;
  color:var(--light);font-size:.84rem;
}
.no-activity-icon{font-size:2rem;margin-bottom:.5rem}

/* ── DIY CARD ── */
.diy-card{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:14px;
  padding:2.5rem;
  text-align:center;
  margin-bottom:1rem;
}
.diy-icon{font-size:2.5rem;margin-bottom:.85rem}
.diy-title{font-size:1.15rem;font-weight:700;color:var(--navy);margin-bottom:.5rem}
.diy-sub{font-size:.84rem;color:var(--mid);line-height:1.7;max-width:460px;margin:0 auto 1.25rem}
.diy-link{
  display:inline-block;
  padding:.55rem 1.25rem;
  background:var(--teal);color:#fff;
  border-radius:8px;font-size:.84rem;
  font-weight:600;text-decoration:none;
  transition:background .15s;
}
.diy-link:hover{background:#029e83}

/* ── ERROR CARD ── */
.error-card{
  background:#fee2e2;border:1px solid #fecaca;
  border-radius:10px;padding:1rem 1.25rem;
  color:#991b1b;font-size:.84rem;
  margin-bottom:1rem;
}

/* ── LOW BALANCE ALERT ── */
.alert-bar{
  background:#fef3c7;border:1px solid #fcd34d;
  border-radius:10px;padding:.75rem 1.1rem;
  font-size:.82rem;color:#92400e;
  display:flex;align-items:center;gap:.65rem;
  margin-bottom:1rem;
}
.alert-icon{font-size:1rem;flex-shrink:0}

/* ── FOOTER ── */
.footer{
  text-align:center;padding:1.25rem;
  font-size:.72rem;color:var(--light);
  border-top:1px solid var(--border);
  margin-top:.5rem;
}
.footer a{color:var(--teal);text-decoration:none}

/* ── LOADING ── */
.loading-state{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:300px;gap:.75rem;
  color:var(--mid);font-size:.84rem;
}
.spinner{
  width:24px;height:24px;
  border:2px solid var(--border);
  border-top-color:var(--teal);
  border-radius:50%;
  animation:spin .75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .balance-hero{flex-direction:column;gap:1.25rem}
  .stat-row{justify-content:stretch}
  .stat-box{flex:1}
  .balance-number{font-size:2.4rem}
  .activity-head,.activity-row{grid-template-columns:1fr 1.5fr auto}
  .activity-head span:nth-child(3),
  .activity-row .act-member{display:none}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="brand">gen<span>head</span></div>
  <div id="plan-pill" class="plan-pill pill-none">Loading...</div>
</div>

<!-- PAGE -->
<div class="page" id="page">
  <div class="loading-state">
    <div class="spinner"></div>
    Loading your support hours...
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  Powered by <a href="https://genhead.com" target="_blank">Genhead</a>
  &nbsp;·&nbsp;
  Questions? <a href="mailto:support@genhead.com">support@genhead.com</a>
</div>

<script>
const API = 'api.php';

// ── Get location ID from URL params ──────────────────────────
function getLocationId(){
  const p = new URLSearchParams(window.location.search);
  return p.get('location') || p.get('loc') || p.get('id') || null;
}

// ── Format helpers ───────────────────────────────────────────
function fmtHrs(n){
  const v = parseFloat(n);
  if(isNaN(v)) return '—';
  return v % 1 === 0 ? v.toString() : v.toFixed(1);
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T12:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function balanceColor(pct){
  if(pct > 40) return 'green';
  if(pct > 15) return 'yellow';
  return 'red';
}
function fillClass(pct){
  if(pct > 40) return 'fill-green';
  if(pct > 15) return 'fill-yellow';
  return 'fill-red';
}

// ── Current state ────────────────────────────────────────────
let currentLocationId = null;

// ── Render DIY plan ──────────────────────────────────────────
function renderDIY(clientName){
  document.getElementById('plan-pill').textContent = 'DIY Plan';
  document.getElementById('plan-pill').className = 'plan-pill pill-diy';
  document.getElementById('page').innerHTML = `
    <div class="diy-card">
      <div class="diy-icon">🛠️</div>
      <div class="diy-title">You're on the DIY Plan</div>
      <div class="diy-sub">
        Your current plan is self-managed — you have full access to build,
        update, and manage your Genhead account independently.<br><br>
        Ready for dedicated Genhead support hours? Reach out and we'll get you set up.
      </div>
      <a class="diy-link" href="mailto:support@genhead.com">Contact Genhead →</a>
    </div>`;
}

// ── Render error ─────────────────────────────────────────────
function renderError(msg){
  document.getElementById('plan-pill').textContent = 'Error';
  document.getElementById('plan-pill').className = 'plan-pill pill-none';
  document.getElementById('page').innerHTML = `
    <div class="error-card">&#9888; ${msg || 'Unable to load your support hours. Please contact Genhead.'}</div>`;
}

// ── Render full portal ───────────────────────────────────────
function renderPortal(data, selectedPeriod){
  const { client, bank, activity, period, periods } = data;

  // Plan pill
  const pill = document.getElementById('plan-pill');
  pill.textContent = client.plan_label || 'Retainer';
  pill.className = 'plan-pill pill-retainer';

  const total     = parseFloat(bank.total_hours ?? 0);
  const used      = parseFloat(bank.used_hours  ?? 0);
  const remaining = parseFloat(bank.remaining   ?? 0);
  const pct       = total > 0 ? Math.max(0, Math.min(100, (remaining / total) * 100)) : 0;
  const color     = balanceColor(pct);
  const fill      = fillClass(pct);

  // Low balance alert
  const lowAlert = (pct <= 20 && total > 0) ? `
    <div class="alert-bar">
      <span class="alert-icon">⚠️</span>
      <span>Your support hours are running low — <strong>${fmtHrs(remaining)} hrs remaining</strong>.
      Contact Genhead to purchase additional hours.</span>
    </div>` : '';

  // Period options
  const periodOpts = (periods || []).map(p =>
    `<option value="${esc(p.value)}" ${p.value === period ? 'selected' : ''}>${esc(p.label)}</option>`
  ).join('');

  // Activity rows
  const actRows = (activity || []).length === 0
    ? `<div class="no-activity">
        <div class="no-activity-icon">📋</div>
        No activity logged yet this month.
       </div>`
    : (activity || []).map(row => `
        <div class="activity-row">
          <span class="act-date">${fmtDate(row.date)}</span>
          <span class="act-task">${esc(row.deliverable || 'Support work')}</span>
          <span class="act-member">${esc(row.team_member || 'Genhead Team')}</span>
          <span class="act-hrs">−${fmtHrs(row.hours)} hrs</span>
        </div>`).join('');

  document.getElementById('page').innerHTML = `
    ${lowAlert}

    <!-- BALANCE HERO -->
    <div class="balance-hero">
      <div class="balance-left">
        <div class="balance-eyebrow">Remaining Support Hours</div>
        <div class="balance-number ${color}">${fmtHrs(remaining)}<span style="font-size:1.2rem;font-weight:400;color:var(--mid)"> hrs</span></div>
        <div class="balance-sub">
          <strong>${fmtHrs(total)} hrs</strong> total this month &nbsp;·&nbsp;
          <strong style="color:var(--red)">${fmtHrs(used)} hrs</strong> used
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-box">
          <div class="stat-val">${fmtHrs(total)}</div>
          <div class="stat-lbl">Total</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" style="color:var(--red)">${fmtHrs(used)}</div>
          <div class="stat-lbl">Used</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" style="color:var(--teal)">${fmtHrs(remaining)}</div>
          <div class="stat-lbl">Left</div>
        </div>
      </div>
    </div>

    <!-- PROGRESS BAR -->
    <div class="progress-wrap">
      <div class="progress-meta">
        <span>${Math.round(pct)}% remaining this month</span>
        <span>${fmtHrs(remaining)} of ${fmtHrs(total)} hrs left</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill ${fill}" style="width:${pct}%"></div>
      </div>
    </div>

    <!-- ACTIVITY LOG -->
    <div class="period-row">
      <div class="section-title">Activity Log</div>
      <select class="period-sel" onchange="switchPeriod(this.value)">
        ${periodOpts}
      </select>
    </div>

    <div class="activity-card">
      <div class="activity-head">
        <span>Date</span>
        <span>Work Performed</span>
        <span>Team Member</span>
        <span style="text-align:right">Hours</span>
      </div>
      ${actRows}
    </div>`;
}

// ── Switch period ────────────────────────────────────────────
async function switchPeriod(period){
  if(!currentLocationId) return;
  document.getElementById('page').innerHTML = `
    <div class="loading-state"><div class="spinner"></div>Loading...</div>`;
  try{
    const r = await fetch(`${API}?action=client_hours&location_id=${encodeURIComponent(currentLocationId)}&month=${encodeURIComponent(period)}`);
    const data = await r.json();
    if(data.success) renderPortal(data, period);
    else renderError(data.error);
  }catch(e){
    renderError('Could not connect. Please try again.');
  }
}

// ── Main init ────────────────────────────────────────────────
async function init(){
  const locationId = getLocationId();

  if(!locationId){
    renderError('No account found. Please access this page through your Genhead portal.');
    return;
  }

  currentLocationId = locationId;

  try{
    const r = await fetch(`${API}?action=client_hours&location_id=${encodeURIComponent(locationId)}`);
    const data = await r.json();

    if(!data.success){
      renderError(data.error || 'Unable to load your account.');
      return;
    }
    if(data.plan === 'diy'){
      renderDIY(data.client?.name);
      return;
    }
    renderPortal(data, data.period);

  }catch(e){
    renderError('Unable to connect to Genhead servers. Please try again shortly.');
  }
}

init();
</script>
</body>
</html>
