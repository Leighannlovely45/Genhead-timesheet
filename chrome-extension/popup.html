<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:340px;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#08153A;color:#fff;font-size:13px}
  .hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand{font-weight:700;font-size:15px;letter-spacing:-.3px}.brand span{color:#03AD8F}
  .who{font-size:11px;color:rgba(255,255,255,.55);text-align:right}
  .who a{color:rgba(255,255,255,.55);cursor:pointer;text-decoration:underline}
  .sec{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.45);margin-bottom:6px}
  .status{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.75)}
  .dot{width:9px;height:9px;border-radius:50%;background:#64748b;flex-shrink:0}.dot.on{background:#03AD8F;box-shadow:0 0 0 3px rgba(3,173,143,.25)}
  .client{font-size:16px;font-weight:600;margin:8px 0 2px;word-break:break-word}
  .timer{font-family:Consolas,'Courier New',monospace;font-size:26px;font-weight:600;color:#03AD8F}
  .sub{font-size:11px;color:rgba(255,255,255,.45)}
  select,input{width:100%;padding:8px 9px;border-radius:7px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font-size:13px;font-family:inherit}
  select option{color:#111}
  input::placeholder{color:rgba(255,255,255,.35)}
  .btn{display:inline-block;border:none;border-radius:7px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-p{background:#03AD8F;color:#fff}.btn-o{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25)}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .warn{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.4);color:#fde68a;border-radius:7px;padding:8px 10px;font-size:11.5px;line-height:1.45;margin-top:8px}
  .err{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.45);color:#fecaca}
  .entry{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}
  .entry:last-child{border-bottom:none}
  .entry .n{color:rgba(255,255,255,.85);overflow:hidden;text-overflow:ellipsis}
  .entry .t{color:rgba(255,255,255,.4);font-size:11px}
  .entry .h{font-family:Consolas,monospace;color:#03AD8F;white-space:nowrap}
  .total{display:flex;justify-content:space-between;font-weight:600;padding-top:8px;margin-top:4px;border-top:1px solid rgba(255,255,255,.1)}
  .muted{color:rgba(255,255,255,.4);font-size:12px}
  code{font-family:Consolas,monospace;background:rgba(255,255,255,.1);padding:1px 4px;border-radius:4px;user-select:all}
  .hidden{display:none}
  #login .sec>*+*{margin-top:8px}
</style>
</head>
<body>
  <div class="hd">
    <div class="brand">gen<span>head</span> <span style="color:rgba(255,255,255,.4);font-weight:400;font-size:12px">Time Tracker</span></div>
    <div class="who" id="who"></div>
  </div>

  <!-- Signed out -->
  <div id="login" class="hidden">
    <div class="sec">
      <div class="lbl">Sign in with your timesheet login</div>
      <input id="email" type="email" placeholder="Your Genhead email" autocomplete="username">
      <input id="pw" type="password" placeholder="Timesheet password" autocomplete="current-password">
      <button class="btn btn-p" id="signin" style="width:100%">Sign In</button>
      <div id="loginMsg" class="sub"></div>
      <div class="sub">First time? Create your password in the timesheet portal first, then sign in here.</div>
    </div>
  </div>

  <!-- Signed in -->
  <div id="main" class="hidden">
    <div class="sec">
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">—</span></div>
      <div class="client" id="client">—</div>
      <div class="timer" id="timer">0:00:00</div>
      <div class="sub" id="timerSub">today in this account</div>
      <div id="notice"></div>
    </div>
    <div class="sec" id="taskSec">
      <div class="lbl">Working on</div>
      <select id="task"></select>
      <div class="sub" id="taskSub" style="margin-top:5px"></div>
    </div>
    <div class="sec">
      <div class="lbl">On your timesheet today</div>
      <div id="today"><div class="muted">Loading…</div></div>
    </div>
    <div class="sec">
      <div class="row">
        <button class="btn btn-o" id="sync">Save now</button>
        <button class="btn btn-p" id="open">Open timesheet</button>
      </div>
      <div class="sub" id="syncInfo" style="margin-top:6px;text-align:center"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
