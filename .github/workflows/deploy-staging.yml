name: Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 sxb1plzcpnl506143.prod.sxb1.secureserver.net >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload to staging via SFTP
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='chrome-extension' \
            --exclude='README.md' \
            --exclude='db.php' \
            --exclude='db.example.php' \
            --exclude='*.log' \
            --exclude='error_log' \
            --exclude='request_log.txt' \
            ./ rouqwneqwsgg@sxb1plzcpnl506143.prod.sxb1.secureserver.net:/home/rouqwneqwsgg/public_html/stagging.timesheet.genhead.com/timesheet/
